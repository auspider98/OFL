<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="OFL Wrapped — every playa's OFC season and BRC bracket, told in slides." />
  <title>OFL — Wrapped</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="admin-config.js"></script>
  <script src="ofl-data.js"></script>
  <script src="ofl-brc-analysis.js"></script>
  <script src="admin.js"></script>
  <script src="ofl-engine.js"></script>
  <script src="ofl-phrasebook.js"></script>
  <script src="ofl-newsroom.js"></script>

  <style>
    /* ══════════════════════════════════════════════════════════
       OFL WRAPPED — all classes prefixed wr-
    ══════════════════════════════════════════════════════════ */
    .wr-page { position: relative; width: 100%; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    .wr-page > .slide-layer      { position: fixed; inset: 0; z-index: 0; height: 100%; }
    .wr-page > .landing-overlay  { position: fixed; inset: 0; z-index: 10; height: 100%; pointer-events: none; }
    .wr-page > .landing-vignette { position: fixed; inset: 0; z-index: 11; height: 100%; pointer-events: none; }
    .wr-body { position: relative; z-index: 20; flex: 1; padding: 5.2rem 0 4rem; }
    .wr-wrap { max-width: 980px; margin: 0 auto; padding: 0 1.4rem; }

    /* ── Landing ──────────────────────────────────────────── */
    .wr-hero { text-align: center; margin-bottom: 1.6rem; opacity: 0; animation: heroReveal 1s 0.1s ease forwards; }
    .wr-eyebrow { font-family: var(--font-body); font-size: 0.55rem; letter-spacing: 0.45em; text-transform: uppercase; color: var(--accent-dim); }
    .wr-title { font-family: var(--font-display); font-size: clamp(2.6rem, 9vw, 4.6rem); line-height: 0.95; color: var(--accent); margin: 0.4rem 0 0.5rem; font-weight: 600; }
    .wr-title em { font-style: italic; background: linear-gradient(100deg, #f6c85f, #ff6b6b 40%, #8a6bff 75%, #44d1c5); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 0.08em; }
    .wr-lede { font-family: var(--font-body); font-size: 0.85rem; letter-spacing: 0.06em; color: var(--accent-dim); max-width: 34rem; margin: 0 auto; line-height: 1.5; }

    .wr-controls { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.4rem; opacity: 0; animation: heroReveal 1s 0.25s ease forwards; }
    .wr-controls button, .wr-controls select {
      font-family: var(--font-body); font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--accent-dim); background: rgba(0,0,0,0.55); border: 1px solid var(--drawer-border); padding: 0.5rem 0.9rem; cursor: pointer;
    }
    .wr-controls select { background-color: #111; color: var(--accent); }
    .wr-controls button.is-on { color: #111; background: var(--accent); border-color: var(--accent); }

    .wr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 170px)); justify-content: center; gap: 0.8rem; opacity: 0; animation: heroReveal 1s 0.4s ease forwards; }
    .wr-tile {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 0.45rem; padding: 1.1rem 0.6rem 0.9rem;
      background: rgba(8,8,8,0.78); border: 1px solid var(--drawer-border); cursor: pointer; text-align: center; color: var(--accent);
      transition: transform 0.25s ease, border-color 0.25s ease; overflow: hidden; font: inherit;
    }
    .wr-tile::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 0%, var(--tc, #888) 0%, transparent 70%); opacity: 0.28; transition: opacity 0.25s ease; }
    .wr-tile:hover, .wr-tile:focus-visible { transform: translateY(-3px); border-color: var(--tc, var(--accent)); outline: none; }
    .wr-tile:hover::before { opacity: 0.5; }
    .wr-tile > * { position: relative; }
    .wr-tile-pic { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; border: 2px solid var(--tc, #888); background: #111; display: flex; align-items: center; justify-content: center; }
    .wr-tile-pic img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
    .wr-tile-pic span { font-family: var(--font-display); font-size: 1.4rem; color: var(--accent-dim); }
    .wr-tile-name { font-family: var(--font-display); font-size: 1.2rem; line-height: 1.05; }
    .wr-tile-team { font-family: var(--font-body); font-size: 0.55rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent-dim); }
    .wr-tile-play { font-family: var(--font-body); font-size: 0.5rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--tc, var(--accent)); margin-top: 0.15rem; filter: brightness(1.6); }
    .wr-empty { text-align: center; font-family: var(--font-body); color: var(--accent-dim); letter-spacing: 0.1em; padding: 3rem 0; }
    .wr-footer { position: relative; z-index: 20; text-align: center; font-family: var(--font-body); font-size: 0.55rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent-dim); opacity: 0.5; padding: 0 2rem 3rem; }

    /* ── Story player ─────────────────────────────────────── */
    .wr-story { position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; }
    .wr-story.is-open { display: flex; }
    body.wr-locked { overflow: hidden; }
    /* Popup mode (?embed=1) — opened inside another page, story only */
    body.wr-embed .topnav, body.wr-embed .drawer, body.wr-embed .drawer-overlay, body.wr-embed .wr-page { display: none !important; }
    body.wr-embed { background: #000; }
    body.wr-embed .wr-story { background: #000; }
    .wr-card {
      position: relative; width: min(440px, 100vw); height: min(880px, 100vh); height: min(880px, 100dvh);
      background: #0a0a0a; overflow: hidden; color: #f4f1ea; user-select: none; -webkit-user-select: none; touch-action: none;
      box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    }
    @media (min-width: 480px) { .wr-card { border-radius: 18px; height: min(880px, 94vh); } }
    .wr-bars { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; gap: 4px; padding: max(10px, env(safe-area-inset-top)) 12px 0; }
    .wr-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.25); border-radius: 2px; overflow: hidden; }
    .wr-bar i { display: block; height: 100%; width: 0; background: #fff; }
    .wr-top { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 12px); left: 12px; right: 12px; z-index: 5; display: flex; align-items: center; gap: 0.5rem; }
    .wr-top-pic { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; background: #222; flex: none; }
    .wr-top-pic img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
    .wr-top-txt { flex: 1; min-width: 0; font-family: var(--font-body); font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wr-top-txt b { font-weight: 600; }
    .wr-top button { background: none; border: none; color: #fff; font-size: 1.3rem; line-height: 1; cursor: pointer; padding: 0.2rem 0.4rem; opacity: 0.85; }
    .wr-paused .wr-top-txt::after { content: ' · Paused'; opacity: 0.7; }

    .wr-slide { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 5.2rem 1.7rem 3.4rem; opacity: 0; pointer-events: none; transition: opacity 0.35s ease; overflow: hidden; }
    .wr-slide.is-on { opacity: 1; pointer-events: auto; }
    .wr-slide::before { content: ''; position: absolute; inset: -20%; background: var(--glow); opacity: 0.85; z-index: 0; }
    .wr-slide::after { content: ''; position: absolute; inset: 0; z-index: 0; opacity: 0.09; pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>"); }
    .wr-slide > * { position: relative; z-index: 1; }
    .wr-ghost { position: absolute !important; z-index: 0 !important; right: -0.08em; bottom: -0.18em; font-family: var(--font-display); font-weight: 700; font-size: 15rem; line-height: 1; color: rgba(255,255,255,0.05); pointer-events: none; white-space: nowrap; }

    /* Reveal animations — run each time a slide turns on */
    .wr-r { opacity: 0; transform: translateY(18px); }
    .wr-slide.is-on .wr-r { animation: wrUp 0.7s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--d, 0) * 1s); }
    .wr-slide.is-on .wr-pop { animation-name: wrPop; }
    @keyframes wrUp { to { opacity: 1; transform: none; } }
    @keyframes wrPop { 0% { opacity: 0; transform: scale(0.6); } 70% { opacity: 1; transform: scale(1.06); } 100% { opacity: 1; transform: none; } }

    .wr-k { font-family: var(--font-body); font-size: 0.66rem; letter-spacing: 0.34em; text-transform: uppercase; opacity: 0.8; margin-bottom: 0.7rem; }
    .wr-h { font-family: var(--font-display); font-size: 2.35rem; line-height: 1.02; font-weight: 600; margin: 0 0 0.8rem; }
    .wr-h em { font-style: italic; }
    .wr-big { font-family: var(--font-display); font-weight: 700; font-size: 6.4rem; line-height: 0.88; letter-spacing: -0.02em; margin: 0.2rem 0 0.4rem; }
    .wr-big .wr-dash { font-weight: 400; opacity: 0.55; margin: 0 0.04em; }
    .wr-big small { font-size: 0.32em; font-weight: 500; letter-spacing: 0; opacity: 0.75; margin-left: 0.15em; }
    .wr-p { font-family: var(--font-body); font-size: 1.02rem; line-height: 1.45; letter-spacing: 0.02em; opacity: 0.92; margin: 0 0 0.6rem; max-width: 24rem; }
    .wr-p b { font-weight: 600; }
    .wr-chip { display: inline-block; font-family: var(--font-body); font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; padding: 0.35rem 0.65rem; border: 1px solid rgba(255,255,255,0.35); border-radius: 99px; margin: 0 0.3rem 0.4rem 0; }
    .wr-chip.is-solid { background: #fff; color: #111; border-color: #fff; }

    /* Intro */
    .wr-intro-pic { width: 150px; height: 150px; border-radius: 50%; overflow: hidden; border: 3px solid #fff; margin-bottom: 1.4rem; background: #1a1a1a; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 8px rgba(255,255,255,0.08); }
    .wr-intro-pic img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
    .wr-intro-pic span { font-family: var(--font-display); font-size: 3rem; opacity: 0.6; }
    .wr-intro-logo { position: absolute !important; top: 5.2rem; right: 1.5rem; width: 64px; height: 64px; object-fit: contain; opacity: 0.9; }

    /* W/L strip */
    .wr-strip { display: flex; flex-wrap: wrap; gap: 5px; margin: 0.6rem 0 1rem; }
    .wr-strip span { width: 24px; height: 30px; display: flex; align-items: center; justify-content: center; font-family: var(--font-body); font-weight: 600; font-size: 0.7rem; border-radius: 3px; opacity: 0; transform: translateY(8px) scale(0.8); }
    .wr-slide.is-on .wr-strip span { animation: wrUp 0.35s ease forwards; animation-delay: calc(0.9s + var(--i) * 0.08s); }
    .wr-strip .W { background: #fff; color: #111; }
    .wr-strip .L { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.75); border: 1px solid rgba(255,255,255,0.25); }
    .wr-strip .T { background: rgba(255,255,255,0.4); color: #111; }

    /* Versus rows */
    .wr-vs { display: flex; align-items: center; gap: 0.8rem; padding: 0.75rem 0; border-top: 1px solid rgba(255,255,255,0.15); }
    .wr-vs:last-child { border-bottom: 1px solid rgba(255,255,255,0.15); }
    .wr-vs-pic { width: 54px; height: 54px; border-radius: 50%; overflow: hidden; background: #1a1a1a; flex: none; display: flex; align-items: center; justify-content: center; border: 2px solid var(--oc, #666); }
    .wr-vs-pic img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
    .wr-vs-pic span { font-family: var(--font-display); opacity: 0.6; }
    .wr-vs-body { flex: 1; min-width: 0; }
    .wr-vs-lab { font-family: var(--font-body); font-size: 0.56rem; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.7; }
    .wr-vs-name { font-family: var(--font-display); font-size: 1.45rem; line-height: 1.05; }
    .wr-vs-note { font-family: var(--font-body); font-size: 0.78rem; opacity: 0.8; margin-top: 0.15rem; }
    .wr-vs-rec { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; white-space: nowrap; }

    /* Odds journey */
    .wr-spark { width: 100%; height: auto; margin: 0.6rem 0 0.9rem; overflow: visible; }
    .wr-spark .ln { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); }
    .wr-slide.is-on .wr-spark .ln { animation: wrDraw 2.2s 0.6s ease-out forwards; }
    .wr-spark .ar { fill: rgba(255,255,255,0.12); opacity: 0; }
    .wr-slide.is-on .wr-spark .ar { animation: wrUp 1s 2.4s forwards; }
    .wr-spark .gd { stroke: rgba(255,255,255,0.18); stroke-dasharray: 3 5; }
    .wr-spark text { font-family: var(--font-body); font-size: 11px; letter-spacing: 0.12em; fill: rgba(255,255,255,0.7); }
    .wr-spark .pt { fill: #fff; opacity: 0; }
    .wr-slide.is-on .wr-spark .pt { animation: wrUp 0.4s 2.6s forwards; }
    @keyframes wrDraw { to { stroke-dashoffset: 0; } }

    /* Round bars (BRC) */
    .wr-rbars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; align-items: end; height: 190px; margin: 0.8rem 0 0.4rem; }
    .wr-rbar { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
    .wr-rbar i { display: block; background: rgba(255,255,255,0.85); border-radius: 3px 3px 0 0; height: 0; transition: height 1s cubic-bezier(.2,.7,.2,1); }
    .wr-rbar.is-best i { background: #f6c85f; }
    .wr-rbar u { position: absolute; left: -3px; right: -3px; height: 0; border-top: 2px dashed rgba(255,255,255,0.55); text-decoration: none; }
    .wr-rbar b { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--font-display); font-size: 1.05rem; transform: translateY(-1.3em); }
    .wr-rlabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; font-family: var(--font-body); font-size: 0.55rem; letter-spacing: 0.12em; text-align: center; opacity: 0.75; text-transform: uppercase; }
    .wr-legend { font-family: var(--font-body); font-size: 0.62rem; letter-spacing: 0.1em; opacity: 0.7; margin-top: 0.7rem; }

    /* Newspaper clipping */
    .wr-clip { background: #f2ecdf; color: #1a1712; padding: 1rem 1.1rem 1.1rem; transform: rotate(-1.6deg); box-shadow: 0 18px 40px rgba(0,0,0,0.5); max-width: 24rem; }
    .wr-clip-mast { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; text-align: center; border-bottom: 3px double #1a1712; padding-bottom: 0.35rem; margin-bottom: 0.15rem; }
    .wr-clip-date { font-family: var(--font-body); font-size: 0.52rem; letter-spacing: 0.22em; text-transform: uppercase; text-align: center; border-bottom: 1px solid #1a1712; padding-bottom: 0.3rem; margin-bottom: 0.7rem; }
    .wr-clip-k { font-family: var(--font-body); font-size: 0.55rem; letter-spacing: 0.28em; text-transform: uppercase; color: #8a1c1c; }
    .wr-clip-h { font-family: var(--font-display); font-size: 1.75rem; line-height: 1.02; font-weight: 700; margin: 0.25rem 0 0.4rem; }
    .wr-clip-s { font-family: var(--font-display); font-style: italic; font-size: 0.98rem; line-height: 1.3; margin: 0; opacity: 0.85; }
    .wr-clip.is-brc .wr-clip-k { color: #1b2b8f; }
    .wr-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; font-family: var(--font-body); font-size: 0.66rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: #111; background: #fff; border: 1px solid #fff; padding: 0.7rem 1.1rem; border-radius: 99px; cursor: pointer; text-decoration: none; }
    .wr-btn.is-ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,0.45); }
    .wr-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1.1rem; }

    /* Outro summary card */
    .wr-sum { border: 1px solid rgba(255,255,255,0.25); background: rgba(0,0,0,0.35); border-radius: 14px; padding: 1rem 1rem 0.8rem; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .wr-sum-top { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.8rem; }
    .wr-sum-pic { width: 58px; height: 58px; border-radius: 50%; overflow: hidden; background: #1a1a1a; flex: none; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; }
    .wr-sum-pic img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
    .wr-sum-name { font-family: var(--font-display); font-size: 1.5rem; line-height: 1; }
    .wr-sum-sub { font-family: var(--font-body); font-size: 0.58rem; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.75; margin-top: 0.25rem; }
    .wr-sum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem 0.9rem; }
    .wr-sum-grid div { border-top: 1px solid rgba(255,255,255,0.15); padding-top: 0.45rem; }
    .wr-sum-grid label { display: block; font-family: var(--font-body); font-size: 0.5rem; letter-spacing: 0.26em; text-transform: uppercase; opacity: 0.65; }
    .wr-sum-grid strong { display: block; font-family: var(--font-display); font-size: 1.3rem; line-height: 1.1; font-weight: 600; }
    .wr-sum-head { font-family: var(--font-display); font-style: italic; font-size: 1rem; line-height: 1.25; margin-top: 0.8rem; padding-top: 0.6rem; border-top: 1px solid rgba(255,255,255,0.15); opacity: 0.9; }
    .wr-toast { position: absolute; left: 50%; bottom: 1.4rem; transform: translateX(-50%); z-index: 8; background: #fff; color: #111; font-family: var(--font-body); font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; padding: 0.5rem 0.9rem; border-radius: 99px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .wr-toast.is-on { opacity: 1; }

    .wr-load { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; font-family: var(--font-body); font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.8; }
    .wr-load i { width: 42px; height: 42px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.2); border-top-color: #fff; animation: wrSpin 0.8s linear infinite; }
    @keyframes wrSpin { to { transform: rotate(360deg); } }
    .wr-hint { position: absolute; bottom: max(0.9rem, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; z-index: 4; font-family: var(--font-body); font-size: 0.52rem; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.45; pointer-events: none; }

    @media (max-width: 380px) {
      .wr-big { font-size: 5.2rem; } .wr-h { font-size: 2rem; } .wr-slide { padding-left: 1.3rem; padding-right: 1.3rem; }
    }
    @media (max-height: 700px) {
      .wr-big { font-size: 4.8rem; } .wr-h { font-size: 1.9rem; } .wr-intro-pic { width: 110px; height: 110px; } .wr-rbars { height: 140px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wr-slide.is-on .wr-r, .wr-slide.is-on .wr-strip span, .wr-slide.is-on .wr-spark * { animation-duration: 0.01s !important; animation-delay: 0s !important; }
    }
    /* ══ THE DIRECTOR: per-story looks ═══════════════════════ */
    .wr-ep { display: inline-block; align-self: flex-start; font-family: var(--font-body); font-size: 0.62rem; letter-spacing: 0.32em; text-transform: uppercase; padding: 0.35rem 0.7rem; margin: 0 0 0.9rem; border: 1px solid var(--a2t, #fff); color: #fff; background: rgba(0,0,0,0.35); }
    .wr-ep::before { content: '\201C'; } .wr-ep::after { content: '\201D'; }
    .wr-top-txt i { font-style: normal; opacity: 0.75; }
    .wr-k i { font-style: normal; opacity: 0.85; }
    /* Transitions */
    .wr-card.tx-slide .wr-slide { transform: translateX(7%); transition: opacity 0.4s ease, transform 0.55s cubic-bezier(.2,.7,.2,1); }
    .wr-card.tx-zoom .wr-slide  { transform: scale(1.07); transition: opacity 0.45s ease, transform 0.8s cubic-bezier(.2,.7,.2,1); }
    .wr-card.tx-wipe .wr-slide  { clip-path: inset(0 0 0 100%); transition: opacity 0.2s ease, clip-path 0.6s cubic-bezier(.7,0,.2,1); }
    .wr-card.tx-fade .wr-slide  { transition: opacity 0.7s ease; }
    .wr-card.tx-slide .wr-slide.is-on, .wr-card.tx-zoom .wr-slide.is-on { transform: none; }
    .wr-card.tx-wipe .wr-slide.is-on { clip-path: inset(0); }
    /* Type treatments */
    .wr-card.ty-outline .wr-big { color: transparent; -webkit-text-stroke: 2px #fff; }
    .wr-card.ty-outline .wr-big small, .wr-card.ty-outline .wr-big .wr-dash { -webkit-text-stroke: 1px #fff; }
    .wr-card.ty-stack .wr-big { font-size: 7.6rem; letter-spacing: -0.04em; }
    .wr-card.ty-caps .wr-h { font-family: var(--font-body); text-transform: uppercase; font-weight: 700; letter-spacing: 0.03em; font-size: 1.85rem; line-height: 1.08; }
    .wr-card.ty-caps .wr-h em { font-style: normal; color: var(--a2t, #fff); }
    .wr-card.ty-italic .wr-h { font-style: italic; font-weight: 500; }

  <script>
  (function () {

    var ALL = [];

    function pctBelow(v) { var lo = 0, hi = ALL.length; while (lo < hi) { var mid = (lo + hi) >> 1; if (ALL[mid] < v) lo = mid + 1; else hi = mid; } return ALL.length ? lo / ALL.length : 0; }

    /* ══════════════════════════════════════════════════════════
       OFC — build one member's season
    ══════════════════════════════════════════════════════════ */
    function ofcWrap(season, m) {

      var log = [], ap = { w: 0, l: 0, t: 0 }, xw = 0, highs = 0, opps = {};

        var beat = 0, others = 0;

        scores.sort(function (a, b) { return b.s - a.s; });
        var wrank = scores.findIndex(function (x) { return x.id === m; }) + 1;
        if (wrank === 1) highs++;

      });

      var longW = 0, run = 0; log.forEach(function (x) { run = x.res === 'W' ? run + 1 : 0; longW = Math.max(longW, run); });
      var paRank = st.rows.slice().sort(function (a, b) { return b.pa - a.pa; }).findIndex(function (r) { return r.id === m; }) + 1;
      var pfRank = st.rows.slice().sort(function (a, b) { return b.pf - a.pf; }).findIndex(function (r) { return r.id === m; }) + 1;

      /* All-time series vs everyone they played this year */
      var series = Object.keys(opps).map(function (o) {
        var r = N.seriesThrough(m, o, yr, K), g = r.a + r.b + r.t;

      }).filter(function (x) { return x.g >= 2; });
      var nem = series.slice().sort(function (a, b) { return a.pct - b.pct || a.diff - b.diff || b.g - a.g; })[0] || null;
      var bag = series.slice().sort(function (a, b) { return b.pct - a.pct || b.diff - a.diff || b.g - a.g; })[0] || null;
      if (nem && bag && nem.id === bag.id) { if (nem.pct >= 0.5) nem = null; else bag = null; }
      if (nem && nem.pct >= 0.5) nem = null;

      {

        var finals = {}; (po.finals || []).forEach(function (g) { finals[g.homeMemberId] = 1; finals[g.awayMemberId] = 1; });
        if (season.championMemberId === m) ending = 'champ';

    function ofcSlides(W) {

      S.push({ k: 'best', bg: glow(c, 2, '#0b1a10'), html:
        '<div class="wr-k wr-r" style="--d:.1">Your Best Week</div>' +
        '<div class="wr-big wr-r" style="--d:.25">' + count(f2(b.s), 2) + '</div>' +

        '<p class="wr-p wr-r" style="--d:.8">Better than <b>' + pctTxt(bPct) + '%</b> of every score in OFC history.' +
          (b.wrank === 1 ? ' Top score of the week.' : ' Only good for ' + ord(b.wrank) + ' that week. Brutal.') + '</p>' +
        (W.highs ? '<p class="wr-p wr-r" style="--d:1.1">You posted the week&rsquo;s top score <b>' + W.highs + ' ' + plural(W.highs, 'time', 'times') + '</b>.</p>' : '') +
        '<div class="wr-ghost">W' + b.k + '</div>' });

        '<p class="wr-p wr-r" style="--d:.8">' + (w.res === 'L' ? esc(wOpp.team) + ' put up ' + f2(w.os) + ' and sent you home by ' + f2(w.os - w.s) + '.' : 'Somehow you <b>won</b> anyway &mdash; ' + esc(wOpp.team) + ' managed only ' + f2(w.os) + '. Steal of the year.') +

      S.push({ k: 'luck', bg: glow(c, 4), html:

        '<div class="wr-big wr-r" style="--d:.8">' + (L >= 0 ? '+' : '&minus;') + count(Math.abs(L).toFixed(1), 1) + '<small>wins</small></div>' +
        '<p class="wr-p wr-r" style="--d:1.1">' + (L >= 0.5 ? 'More wins than your scoring earned. The schedule did you favors.' : L <= -0.5 ? 'Fewer wins than your scoring earned. Take it up with the schedule.' : 'Right on the number. No excuses, no gifts.') +

    function brcRows(season) {
      var rows = (season.standings || []).filter(function (r) { return r.memberId; }).map(function (r) {

    function sameTeam(a, b) {

    }
    function brcWrap(season, m) {
      var rows = brcRows(season), me = rows.find(function (x) { return x.id === m; });

      var I = { owner: mm.name || me.r.owner || '?', team: me.r.bracketName || me.r.teamName || mm.name || '?', mug: mm.mugshot || '' };

      var avg = [0, 1, 2, 3, 4, 5].map(function (i) { return rows.reduce(function (s, x) { return s + (x.pbr[i] || 0); }, 0) / rows.length; });
      var bestR = -1, bestD = -1e9;
      if (hasRounds) me.pbr.forEach(function (v, i) { var d = v - avg[i]; if (v > 0 && d > bestD) { bestD = d; bestR = i; } });
      var correct = me.cbr.reduce(function (s, v) { return s + v; }, 0) || num(me.r.correctPicks);
      var winner = season.tournamentWinner || '';
      var sameChamp = me.champ ? rows.filter(function (x) { return x.id !== m && sameTeam(x.champ, me.champ); }).length : 0;
      var champHit = me.champ && winner ? sameTeam(me.champ, winner) : null;
      var head = null;
      N.brc.editions.forEach(function (e) {
        if (e.s !== season) return;
        var ed; try { ed = N.brc.write(e); } catch (x) { return; }
        ed.stories.forEach(function (s, i) {
          if (s.team !== m) return;

          if (!head || sc >= head.sc) head = { sc: sc, s: s, e: e, lead: i === 0 };
        });
      });

      var sorted = rows.slice().sort(function (a, b) { return b.pts - a.pts; }), lead = sorted[0], next = sorted[1];

        var rr = brcRows(s), x = rr.find(function (q) { return q.id === m; });
        if (!x) return;
        car.n++; if (s.championMemberId === m && s.isFinal) car.titles++; if (x.rank <= 3) car.podiums++;
        car.best = Math.min(car.best, x.rank); car.sumPct += rr.length > 1 ? (x.rank - 1) / (rr.length - 1) : 0;
      });
      return { lg: 'brc', season: season, yr: yr, m: m, I: I, me: me, rows: rows, n: rows.length, hasRounds: hasRounds, avg: avg, bestR: bestR, bestD: bestD,
        correct: correct, winner: winner, sameChamp: sameChamp, champHit: champHit, head: head,
        won: season.championMemberId === m, rounds: rounds, gap: gap, car: car };
    }

    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();
