<body>

  <nav class="topnav" role="navigation" aria-label="Site navigation">
    <a href="index.html" class="topnav-logo">OFC</a>
    <button class="menu-trigger" aria-label="Open navigation menu" aria-expanded="false" aria-controls="site-drawer">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="drawer-overlay" aria-hidden="true"></div>
  <aside id="site-drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Navigation">
    <p class="drawer-label">Navigate</p>
    <ul class="drawer-nav"></ul>
    <div class="drawer-footer"></div>
  </aside>

  <div class="race-page">
    <div class="slide-layer" id="slideA" aria-hidden="true"></div>
    <div class="slide-layer" id="slideB" aria-hidden="true"></div>
    <div class="landing-overlay" id="prOverlay" aria-hidden="true"></div>
    <div class="landing-vignette" aria-hidden="true"></div>

    <header class="race-hero">
      <p class="race-hero-eyebrow" id="prEyebrow">OFC Playoff Race</p>
      <h1 class="race-hero-title">Playoff Race</h1>
      <p class="race-hero-subtitle" id="prSubtitle">10,000 Simulated Seasons</p>
    </header>

    <div class="race-body">
      <div class="race-wrap section-reveal" style="animation-delay:0.5s" id="prWrap"></div>
    </div>
    <div class="race-footer" id="prFooter"></div>
  </div>

  <script src="sound.js"></script>
  <script src="menu.js"></script>

  <script>
  (function () {
    'use strict';

    var SIMS = 10000;          // simulated seasons per run
    var PLAYOFF_TEAMS = 4;     // OFC: 4 teams, no byes
    var SHRINK = 4;            // games of league-average "prior" blended into each team's scoring

    /* ── Helpers ──────────────────────────────────────────── */
    function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }
    function initials(n) { return (n || '?').split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase(); }
    function pct(x) { return Math.round(x * 100); }
    function pctLabel(x) {
      if (x >= 0.9995) return '100'; if (x > 0 && x < 0.005) return '<1'; if (x < 1 && x > 0.995) return '>99';
      return String(pct(x));
    }
    function hex(h) { return /^#[0-9a-f]{6}$/i.test(String(h || '').trim()) ? h : null; }

    /* Seeded RNG so numbers don't jitter between identical runs */
    function rng(seed) {
      var a = seed >>> 0;
      return function () {
        a = (a + 0x6D2B79F5) >>> 0; var t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function gauss(r) {
      var u = 0, v = 0; while (u === 0) u = r(); v = r();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }

    /* ══════════════════════════════════════════════════════════
       DATA — current OFC season
    ══════════════════════════════════════════════════════════ */
    var DATA = window.OFL_DATA || {};
    var ROSTER = DATA.masterRoster || [];
    var OFC = (DATA.leagueData || []).find(function (l) { return l.sport === 'football'; }) || null;
    var SEASON = OFC ? ((OFC.seasons || []).find(function (s) { return !s.isFinal && (s.weeks || []).length; }) || null) : null;

    function identity(mid, fallbackTeam) {
      var m = ROSTER.find(function (r) { return r.id === mid; }) || {};
      var e = (m.leagues || []).find(function (l) { return l.leagueKey === 'OFC'; });
      var t = e && e.teams && e.teams.length ? e.teams[e.teams.length - 1] : null;
      return { id: mid, owner: m.name || '', team: fallbackTeam || (t && t.name) || m.name || '?',
        logo: (t && t.logo) || m.mugshot || '', color: hex(t && t.primaryColor) || '#888888' };
    }

    var TEAMS = {}, TEAM_IDS = [], PLAYED = [], WEEKS = [], CYCLE = 7, LAST_DONE = 0, SCHEDULE_SOURCE = '';
    (function build() {
      if (!SEASON) return;
      WEEKS = (SEASON.weeks || []).slice().sort(function (a, b) { return (a.weekNumber || 0) - (b.weekNumber || 0); });
      WEEKS.forEach(function (w) {
        (w.games || []).forEach(function (g) {
          [g.home, g.away].forEach(function (s) {
            if (s && s.memberId && !TEAMS[s.memberId]) { TEAMS[s.memberId] = identity(s.memberId, s.teamName); TEAM_IDS.push(s.memberId); }
            else if (s && s.memberId && s.teamName) TEAMS[s.memberId].team = s.teamName;
          });
        });
        if (w.isComplete) {
          LAST_DONE = Math.max(LAST_DONE, w.weekNumber || 0);
          (w.games || []).forEach(function (g) {
            if (!g.home || !g.away || !g.home.memberId || !g.away.memberId) return;
            PLAYED.push({ week: w.weekNumber, h: g.home.memberId, a: g.away.memberId, hs: num(g.home.score), as: num(g.away.score) });
          });
        }
      });
      CYCLE = Math.max(1, TEAM_IDS.length - 1);
    })();

    /* Regular season length — set per season in ofl-data.html (blank = 15) */
    var REG_WEEKS = (SEASON && parseInt(SEASON.regularSeasonWeeks, 10)) || 15;

    /* Mathematical clinch / elimination from real results (same rules as league.html):
       wins only, every tie counted as lost, so a tag never shows early */
    function clinchStatus(base) {
      var left = Math.max(0, REG_WEEKS - LAST_DONE), out = {};
      if (TEAM_IDS.length <= PLAYOFF_TEAMS) return out;
      var w = {}; TEAM_IDS.forEach(function (id) { w[id] = base[id].w + base[id].t * 0.5; });
      TEAM_IDS.forEach(function (id) {
        var canCatch = TEAM_IDS.filter(function (o) { return o !== id && w[o] + left >= w[id]; }).length;
        var ahead    = TEAM_IDS.filter(function (o) { return o !== id && w[o] > w[id] + left; }).length;
        if (canCatch === 0) out[id] = 'y';
        else if (canCatch < PLAYOFF_TEAMS) out[id] = 'x';
        else if (ahead >= PLAYOFF_TEAMS) out[id] = 'e';
      });
      return out;
    }

    /* Remaining schedule: use real matchups if loaded, else Yahoo's repeating cycle */
    function remainingSchedule() {
      var out = [], usedPattern = false;
      for (var wk = LAST_DONE + 1; wk <= REG_WEEKS; wk++) {
        var loaded = WEEKS.find(function (w) { return w.weekNumber === wk && (w.games || []).length; });
        var src = loaded;
        if (!src) {
          var mirror = ((wk - 1) % CYCLE) + 1;
          src = WEEKS.find(function (w) { return w.weekNumber === mirror; });
          usedPattern = true;
        }
        if (!src) continue;
        (src.games || []).forEach(function (g, i) {
          if (!g.home || !g.away || !g.home.memberId || !g.away.memberId) return;
          out.push({ id: wk + '-' + i, week: wk, h: g.home.memberId, a: g.away.memberId });
        });
      }
      SCHEDULE_SOURCE = usedPattern ? 'pattern' : 'loaded';
      return out;
    }

    /* Scoring model per team — season mean & spread, shrunk toward league average */
    function scoringModel() {
      var all = [], per = {};
      TEAM_IDS.forEach(function (id) { per[id] = []; });
      PLAYED.forEach(function (g) { per[g.h].push(g.hs); per[g.a].push(g.as); all.push(g.hs, g.as); });
      var lm = all.reduce(function (s, v) { return s + v; }, 0) / (all.length || 1);
      var lv = all.reduce(function (s, v) { return s + (v - lm) * (v - lm); }, 0) / (all.length || 1);
      var model = {};
      TEAM_IDS.forEach(function (id) {
        var xs = per[id], n = xs.length;
        var m = n ? xs.reduce(function (s, v) { return s + v; }, 0) / n : lm;
        var v = n ? xs.reduce(function (s, x) { return s + (x - m) * (x - m); }, 0) / n : lv;
        model[id] = { mu: (n * m + SHRINK * lm) / (n + SHRINK), sd: Math.sqrt((n * v + SHRINK * lv) / (n + SHRINK)) };
      });
      return model;
    }

    /* Current standings (from game data, tiebreaker = points for) */
    function baseStandings() {
      var st = {};
      TEAM_IDS.forEach(function (id) { st[id] = { w: 0, l: 0, t: 0, pf: 0 }; });
      PLAYED.forEach(function (g) {
        st[g.h].pf += g.hs; st[g.a].pf += g.as;
        if (g.hs > g.as) { st[g.h].w++; st[g.a].l++; }
        else if (g.as > g.hs) { st[g.a].w++; st[g.h].l++; }
        else { st[g.h].t++; st[g.a].t++; }
      });
      return st;
    }

    /* ══════════════════════════════════════════════════════════
       SIMULATION
    ══════════════════════════════════════════════════════════ */
    function simulate(n, schedule, picks, model, base, seed) {
      var r = rng(seed), ids = TEAM_IDS, k = ids.length;
      var idx = {}; ids.forEach(function (id, i) { idx[id] = i; });
      var bw = ids.map(function (id) { return base[id].w + base[id].t * 0.5; });
      var bpf = ids.map(function (id) { return base[id].pf; });
      var seedCount = ids.map(function () { return [0, 0, 0, 0, 0]; }); // seeds 1-4 + miss
      var winSum = ids.map(function () { return 0; });
      var gameWins = {}; schedule.forEach(function (g) { gameWins[g.id] = 0; });
      var w = new Float64Array(k), pf = new Float64Array(k), order = ids.map(function (_, i) { return i; });
      // Extra bookkeeping for the team "Path" panels
      var G = schedule.length, homeWon = new Uint8Array(G), made = new Uint8Array(k);
      var gHW = new Float64Array(G), gamePO = [], poTotal = new Float64Array(k);
      var gameT1 = [], gameT2 = [], t1Total = new Float64Array(k), t2Total = new Float64Array(k);
      var top1 = new Uint8Array(k), top2 = new Uint8Array(k);
      for (var gj = 0; gj < G; gj++) { gamePO.push(new Float64Array(k)); gameT1.push(new Float64Array(k)); gameT2.push(new Float64Array(k)); }
      var remCount = ids.map(function () { return 0; });
      schedule.forEach(function (g) { remCount[idx[g.h]]++; remCount[idx[g.a]]++; });
      var winB = ids.map(function (_, i) { return new Float64Array(remCount[i] + 1); });
      var winBPO = ids.map(function (_, i) { return new Float64Array(remCount[i] + 1); });

      for (var s = 0; s < n; s++) {
        for (var i = 0; i < k; i++) { w[i] = bw[i]; pf[i] = bpf[i]; }
        for (var j = 0; j < schedule.length; j++) {
          var g = schedule[j], hi = idx[g.h], ai = idx[g.a];
          var hs = model[g.h].mu + model[g.h].sd * gauss(r);
          var as_ = model[g.a].mu + model[g.a].sd * gauss(r);
          var forced = picks[g.id];
          if (forced === 'h' && hs <= as_) { var tmp = hs; hs = as_; as_ = tmp; }
          if (forced === 'a' && as_ <= hs) { var tmp2 = hs; hs = as_; as_ = tmp2; }
          pf[hi] += hs; pf[ai] += as_;
          if (hs > as_) { w[hi]++; gameWins[g.id]++; homeWon[j] = 1; } else { w[ai]++; homeWon[j] = 0; }
        }
        order.sort(function (x, y) { return (w[y] - w[x]) || (pf[y] - pf[x]); });
        for (var p = 0; p < k; p++) {
          var t = order[p];
          seedCount[t][p < PLAYOFF_TEAMS ? p : 4]++;
          winSum[t] += w[t];
          made[t] = p < PLAYOFF_TEAMS ? 1 : 0;
          top1[t] = p === 0 ? 1 : 0; top2[t] = p < 2 ? 1 : 0;
          t1Total[t] += top1[t]; t2Total[t] += top2[t];
        }
        for (var q = 0; q < k; q++) {
          var rw = Math.round(w[q] - bw[q]);
          winB[q][rw]++; if (made[q]) { winBPO[q][rw]++; poTotal[q]++; }
        }
        for (var gk = 0; gk < G; gk++) {
          if (!homeWon[gk]) continue;
          gHW[gk]++;
          var row = gamePO[gk], r1 = gameT1[gk], r2 = gameT2[gk];
          for (var q2 = 0; q2 < k; q2++) { row[q2] += made[q2]; r1[q2] += top1[q2]; r2[q2] += top2[q2]; }
        }
      }
      var res = {};
      ids.forEach(function (id, i) {
        var sc = seedCount[i];
        res[id] = {
          seeds: sc.map(function (c) { return c / n; }),
          playoff: (sc[0] + sc[1] + sc[2] + sc[3]) / n,
          top: sc[0] / n,
          projW: winSum[i] / n,
          rem: remCount[i],
          byWins: Array.prototype.map.call(winB[i], function (c, kk) { return { k: kk, n: c, po: c ? winBPO[i][kk] / c : 0 }; })
        };
      });
      res._n = n; res._idx = idx; res._gHW = gHW; res._gamePO = gamePO; res._poTotal = poTotal;
      res._gameT1 = gameT1; res._gameT2 = gameT2; res._t1Total = t1Total; res._t2Total = t2Total;
      res._homeWinPct = {}; schedule.forEach(function (g) { res._homeWinPct[g.id] = gameWins[g.id] / n; });
      return res;
    }

    /* ══════════════════════════════════════════════════════════
       STATE + RENDER
    ══════════════════════════════════════════════════════════ */
    var state = { picks: {}, tabWeek: null, open: null, spot: undefined };   // spot: undefined = auto (biggest swing), 'none' = closed, or a game id
    var LAST = null;   // last simulation result, reused when a panel opens/closes
    var CLINCH = {};
    var MODEL = null, BASE = null, SCHED = [], BASELINE = null;

    function recompute(full) {
      SCHED = remainingSchedule();
      MODEL = scoringModel();
      BASE = baseStandings();
      CLINCH = clinchStatus(BASE);
      if (full || !BASELINE) {
        BASELINE = simulate(SIMS, SCHED, {}, MODEL, BASE, 20260);
      }
      var hasPicks = Object.keys(state.picks).length > 0;
      var current = hasPicks ? simulate(SIMS, SCHED, state.picks, MODEL, BASE, 20260) : BASELINE;
      LAST = { res: current, hasPicks: hasPicks };
      render(current, hasPicks);
    }

    /* ══════════════════════════════════════════════════════════
       PATH TO THE PLAYOFFS — per-team breakdown
    ══════════════════════════════════════════════════════════ */

    /* Playoff odds for team id if game j's home / away team wins (null if the game is picked) */
    function condOdds(res, j, id) {
      var n = res._n, hw = res._gHW[j], t = res._idx[id];
      if (hw === 0 || hw === n) return null;
      var withH = res._gamePO[j][t] / hw;
      var withA = (res._poTotal[t] - res._gamePO[j][t]) / (n - hw);
      return { h: withH, a: withA };
    }

    function oddsClass(p) { return p >= 0.9 ? 'g' : (p >= 0.5 ? 'y' : (p >= 0.1 ? 'o' : 'r')); }
    function wks(n) { return n === 1 ? '1 win' : n + ' wins'; }

    /* Exact scenarios — only when 2 or fewer regular-season weeks remain.
       Every remaining game result is enumerated; a result set "guarantees in" when the
       team finishes top 4 on wins alone (ties on wins could go either way → points for). */
    function buildScenarios(schedule, picks) {
      var left = REG_WEEKS - LAST_DONE;
      if (left < 1 || left > 2) return null;
      var games = schedule.map(function (g, j) { return { g: g, j: j, fixed: picks[g.id] || null }; });
      var free = games.filter(function (x) { return !x.fixed; });
      if (free.length > 12) return null;
      var ids = TEAM_IDS, combos = 1 << free.length, outcomes = [];
      for (var m = 0; m < combos; m++) {
        var res = {}, w = {};
        ids.forEach(function (id) { w[id] = BASE[id].w + BASE[id].t * 0.5; });
        games.forEach(function (x) {
          var side = x.fixed || ((m >> free.indexOf(x)) & 1 ? 'h' : 'a');
          res[x.j] = side; w[side === 'h' ? x.g.h : x.g.a]++;
        });
        var status = {};
        ids.forEach(function (id) {
          var atLeast = ids.filter(function (o) { return o !== id && w[o] >= w[id]; }).length;
          var above   = ids.filter(function (o) { return o !== id && w[o] >  w[id]; }).length;
          status[id] = atLeast < PLAYOFF_TEAMS ? 'in' : (above >= PLAYOFF_TEAMS ? 'out' : 'tb');
        });
        outcomes.push({ res: res, status: status });
      }
      var lits = [];
      free.forEach(function (x) { lits.push({ j: x.j, side: 'h', g: x.g }, { j: x.j, side: 'a', g: x.g }); });
      function matches(o, conj) { return conj.every(function (l) { return o.res[l.j] === l.side; }); }
      function guarantees(id, conj, want) {
        var any = false;
        for (var i = 0; i < outcomes.length; i++) {
          if (!matches(outcomes[i], conj)) continue;
          any = true; if (outcomes[i].status[id] !== want) return false;
        }
        return any;
      }
      function find(id, want) {
        var possible = outcomes.some(function (o) { return o.status[id] === want; });
        if (!possible) return { possible: false, sets: [] };
        if (guarantees(id, [], want)) return { possible: true, sets: [[]] };
        var singles = lits.filter(function (l) { return guarantees(id, [l], want); });
        var pairs = [];
        for (var a = 0; a < lits.length; a++) for (var b = a + 1; b < lits.length; b++) {
          var la = lits[a], lb = lits[b];
          if (la.j === lb.j) continue;
          if (singles.indexOf(la) !== -1 || singles.indexOf(lb) !== -1) continue;
          if (guarantees(id, [la, lb], want)) pairs.push([la, lb]);
        }
        // Prefer combos that include the team's own result
        pairs.sort(function (x, y) {
          var ox = x.some(function (l) { return l.g.h === id || l.g.a === id; }) ? 0 : 1;
          var oy = y.some(function (l) { return l.g.h === id || l.g.a === id; }) ? 0 : 1;
          return ox - oy;
        });
        return { possible: true, sets: singles.map(function (l) { return [l]; }).concat(pairs).slice(0, 4) };
      }
      var out = {};
      ids.forEach(function (id) { out[id] = { clinch: find(id, 'in'), elim: find(id, 'out') }; });
      out._twoWeeks = left === 2;
      return out;
    }

    function litText(l, id, twoWeeks) {
      var winner = l.side === 'h' ? l.g.h : l.g.a, loser = l.side === 'h' ? l.g.a : l.g.h;
      var wk = twoWeeks ? ' (Wk ' + l.g.week + ')' : '';
      if (winner === id) return 'a win over ' + esc(TEAMS[loser].team) + wk;
      if (loser === id)  return 'a loss to ' + esc(TEAMS[winner].team) + wk;
      return esc(TEAMS[winner].team) + ' beating ' + esc(TEAMS[loser].team) + wk;
    }
    function setText(set, id, twoWeeks) {
      if (!set.length) return 'already done';
      return set.map(function (l) { return litText(l, id, twoWeeks); }).join(' <em>and</em> ');
    }

    function pathPanel(id, res, scen) {
      var t = TEAMS[id], r = res[id], b = BASE[id], cs = CLINCH[id], R = r.rem, next = LAST_DONE + 1;
      var out = '';

      /* Headline */
      var buckets = r.byWins.filter(function (x) { return x.n >= Math.max(25, res._n * 0.002); });
      var safe = buckets.filter(function (x) { return x.po >= 0.9; }).map(function (x) { return x.k; });
      var coin = buckets.filter(function (x) { return x.po >= 0.5; }).map(function (x) { return x.k; });
      var top = buckets.length ? buckets[buckets.length - 1] : null;
      var head;
      if (cs === 'y') head = 'Locked up the #1 seed. Rest the starters.';
      else if (cs === 'x') head = 'Clinched a playoff spot. Now it&rsquo;s all about seeding (' + pctLabel(r.top) + '% for #1).';
      else if (cs === 'e') head = 'Mathematically eliminated. Spoiler season starts now.';
      else if (!R) head = 'No games left. It&rsquo;s out of their hands now.';
      else if (r.playoff < 0.01) head = 'Hanging by a thread at ' + pctLabel(r.playoff) + '%. ' +
        (top && top.po >= 0.1 ? 'A perfect ' + R + '&ndash;0 finish would get them to ' + pctLabel(top.po) + '%. Until then, it&rsquo;s spoiler season.' : 'It&rsquo;s spoiler season.');
      else if (safe.length) head = (safe[0] === 0 ? 'Safe even if they lose out' : '<b>' + wks(safe[0]) + '</b> in the last ' + R + ' gets ' + esc(t.team) + ' to 90%+') + (coin.length && coin[0] < safe[0] ? '; ' + wks(coin[0]) + ' makes it a coin flip or better.' : '.');
      else if (top && top.po >= 0.5) head = 'Winning out gets them to ' + pctLabel(top.po) + '%. Anything less and they need help.';
      else if (top) head = 'Even winning out only gets them to ' + pctLabel(top.po) + '%. They need help.';
      else head = 'Still alive, barely.';
      out += '<p class="race-path-head">' + head + '</p>';

      /* Spoiler duty — eliminated teams, or under 1%: whose season can they still wreck? */
      if (cs === 'e' || r.playoff < 0.01) out += spoilerSection(id, res);

      /* 1. Win total table */
      if (R && buckets.length && cs !== 'e') {
        out += '<div class="race-path-label">Finish the Last ' + R + '</div><div class="race-wins">' +
          buckets.slice().reverse().map(function (x) {
            var fw = b.w + x.k, fl = b.l + (R - x.k);
            return '<div class="race-win-chip ' + oddsClass(x.po) + '">' +
              '<span class="rec">' + x.k + '&ndash;' + (R - x.k) + '</span>' +
              '<span class="pct">' + pctLabel(x.po) + '%</span>' +
              '<span class="fin">' + fw + '&ndash;' + fl + (b.t ? '&ndash;' + b.t : '') + '</span>' +
            '</div>';
          }).join('') + '</div>';
      }

      /* 4. Scenarios (last two weeks) */
      if (scen && scen[id] && cs !== 'x' && cs !== 'y' && cs !== 'e') {
        var sc = scen[id], tw = scen._twoWeeks, lines = '';
        if (sc.clinch.possible) {
          lines += '<div class="race-scn in"><span class="k">Clinches with</span>' +
            (sc.clinch.sets.length ? sc.clinch.sets.map(function (st) { return '<span class="v">' + setText(st, id, tw) + '</span>'; }).join('<span class="or">or</span>')
                                    : '<span class="v">3 or more results going their way</span>') + '</div>';
        } else lines += '<div class="race-scn out"><span class="k">Clinch</span><span class="v">Can&rsquo;t clinch on wins alone, needs a points-for tiebreaker</span></div>';
        if (sc.elim.possible) {
          lines += '<div class="race-scn out"><span class="k">Eliminated with</span>' +
            (sc.elim.sets.length ? sc.elim.sets.map(function (st) { return '<span class="v">' + setText(st, id, tw) + '</span>'; }).join('<span class="or">or</span>')
                                 : '<span class="v">3 or more results going against them</span>') + '</div>';
        }
        out += '<div class="race-path-label">Scenarios</div>' + lines +
          '<p class="race-path-note">Anything not listed comes down to points for if teams tie on wins.</p>';
      }

      /* 2. This week's rooting guide */
      var nextGames = SCHED.map(function (g, j) { return { g: g, j: j }; }).filter(function (x) { return x.g.week === next; });
      if (nextGames.length && cs !== 'e') {
        var own = nextGames.find(function (x) { return x.g.h === id || x.g.a === id; });
        var guide = '';
        if (own) {
          var opp = own.g.h === id ? own.g.a : own.g.h;
          var c = condOdds(res, own.j, id);
          if (c) {
            var wp = own.g.h === id ? c.h : c.a, lp = own.g.h === id ? c.a : c.h;
            guide += '<div class="race-root own"><span class="who">Beat ' + esc(TEAMS[opp].team) + '</span>' +
              '<span class="val"><b class="' + oddsClass(wp) + '">' + pctLabel(wp) + '%</b> with a win &middot; <b class="' + oddsClass(lp) + '">' + pctLabel(lp) + '%</b> with a loss</span></div>';
          } else {
            var pk = state.picks[own.g.id];
            guide += '<div class="race-root own"><span class="who">vs ' + esc(TEAMS[opp].team) + '</span><span class="val">Picked to ' + (((pk === 'h') === (own.g.h === id)) ? 'win' : 'lose') + '</span></div>';
          }
        }
        var others = nextGames.filter(function (x) { return x !== own; }).map(function (x) {
          var c2 = condOdds(res, x.j, id); if (!c2) return null;
          var d = c2.h - c2.a;
          return { g: x.g, side: d >= 0 ? 'h' : 'a', mag: Math.round(Math.abs(d) * 100) };
        }).filter(function (x) { return x && x.mag >= 1; }).sort(function (a, b2) { return b2.mag - a.mag; }).slice(0, 3);
        others.forEach(function (x) {
          var wn = x.side === 'h' ? x.g.h : x.g.a, ls = x.side === 'h' ? x.g.a : x.g.h;
          guide += '<div class="race-root"><span class="who">Root for ' + esc(TEAMS[wn].team) + '</span><span class="val">over ' + esc(TEAMS[ls].team) + ' <b class="g">+' + x.mag + '</b></span></div>';
        });
        if (!others.length && own) guide += '<p class="race-path-note">No other game this week moves their odds much. Just win.</p>';
        if (guide) out += '<div class="race-path-label">Week ' + next + ' Rooting Guide</div>' + guide;
      }

      /* 3. Biggest games left (after this week) */
      if (cs !== 'e') {
        var later = SCHED.map(function (g, j) { return { g: g, j: j }; }).filter(function (x) { return x.g.week > next; }).map(function (x) {
          var c3 = condOdds(res, x.j, id); if (!c3) return null;
          var d3 = c3.h - c3.a;
          return { g: x.g, side: d3 >= 0 ? 'h' : 'a', mag: Math.round(Math.abs(d3) * 100), mine: x.g.h === id || x.g.a === id };
        }).filter(function (x) { return x && x.mag >= 2; }).sort(function (a, b3) { return b3.mag - a.mag; }).slice(0, 3);
        if (later.length) {
          out += '<div class="race-path-label">Biggest Games Left</div>' + later.map(function (x) {
            var wn = x.side === 'h' ? x.g.h : x.g.a, ls = x.side === 'h' ? x.g.a : x.g.h;
            var txt = x.mine
              ? (wn === id ? 'Beat ' + esc(TEAMS[ls].team) : 'vs ' + esc(TEAMS[wn].team))
              : esc(TEAMS[wn].team) + ' over ' + esc(TEAMS[ls].team);
            return '<div class="race-root' + (x.mine ? ' own' : '') + '"><span class="who">Wk ' + x.g.week + ' &middot; ' + txt + '</span><span class="val">&plusmn;<b>' + x.mag + '</b> pts</span></div>';
          }).join('');
        }
      }
      return '<div class="race-path">' + out + '</div>';
    }

    /* For each remaining game of an (all-but) eliminated team: how far a win drags the
       opponent's playoff odds down, and which contenders get a boost from it */
    function spoilerSection(id, res) {
      var games = SCHED.map(function (g, j) { return { g: g, j: j }; })
        .filter(function (x) { return x.g.h === id || x.g.a === id; });
      if (!games.length) return '';
      var rows = games.map(function (x) {
        var isH = x.g.h === id, opp = isH ? x.g.a : x.g.h;
        var c = condOdds(res, x.j, opp);
        if (!c) {
          var pk = state.picks[x.g.id];
          return { g: x.g, opp: opp, picked: ((pk === 'h') === isH) ? 'win' : 'loss', dmg: -1 };
        }
        // opponent's odds when THIS team wins vs loses
        var oppIfWeWin  = isH ? c.h : c.a;
        var oppIfWeLose = isH ? c.a : c.h;
        var helps = TEAM_IDS.filter(function (o) { return o !== id && o !== opp; }).map(function (o) {
          var co = condOdds(res, x.j, o); if (!co) return null;
          var d = isH ? co.h - co.a : co.a - co.h;
          return { id: o, d: Math.round(d * 100) };
        }).filter(function (h) { return h && h.d >= 2; }).sort(function (a, b) { return b.d - a.d; }).slice(0, 2);
        return { g: x.g, opp: opp, win: oppIfWeWin, lose: oppIfWeLose, dmg: Math.round((oppIfWeLose - oppIfWeWin) * 100), helps: helps };
      }).sort(function (a, b) { return b.dmg - a.dmg; });

      var target = rows[0] && rows[0].dmg >= 3 ? rows[0] : null;
      var html = '<div class="race-path-label">Spoiler Duty</div>';
      html += target
        ? '<p class="race-spoil-head">Biggest target: <b style="color:' + TEAMS[target.opp].color + '">' + esc(TEAMS[target.opp].team) + '</b> in Week ' + target.g.week +
            '. A win drops them from ' + pctLabel(target.lose) + '% to ' + pctLabel(target.win) + '%.</p>'
        : '<p class="race-spoil-head">Nobody left on the schedule has much riding on these games. Play for pride.</p>';
      html += rows.map(function (x) {
        var T = TEAMS[x.opp];
        if (x.dmg === -1) {
          return '<div class="race-spoil"><span class="wk">Wk ' + x.g.week + '</span>' +
            '<span class="opp">vs ' + esc(T.team) + '</span><span class="dmg">Picked: ' + x.picked + '</span></div>';
        }
        return '<div class="race-spoil">' +
          '<span class="wk">Wk ' + x.g.week + '</span>' +
          '<span class="opp">vs ' + esc(T.team) +
            '<span class="odds">their odds ' + pctLabel(x.lose) + '% &rarr; ' + pctLabel(x.win) + '% with your win</span>' +
            (x.helps.length ? '<span class="helps">Also helps ' + x.helps.map(function (h) { return esc(TEAMS[h.id].team) + ' <b>+' + h.d + '</b>'; }).join(', ') + '</span>' : '') +
          '</span>' +
          '<span class="dmg' + (x.dmg >= 10 ? ' big' : '') + '">' + (x.dmg > 0 ? '&minus;' + x.dmg : '0') + '</span>' +
        '</div>';
      }).join('');
      return html;
    }

    /* How much team o gains (home win minus away win) in game j, in percentage points:
       playoff odds, #1-seed odds and top-2 odds. Null when the game is picked. */
    function stakeFor(res, j, o) {
      var n = res._n, hw = res._gHW[j], t = res._idx[o];
      if (hw === 0 || hw === n) return null;
      function diff(arr, tot) { return (arr[j][t] / hw - (tot[t] - arr[j][t]) / (n - hw)) * 100; }
      return { po: diff(res._gamePO, res._poTotal), t1: diff(res._gameT1, res._t1Total), t2: diff(res._gameT2, res._t2Total) };
    }

    /* This season's head-to-head record (real results only) */
    var H2H = null;
    function seasonH2H() {
      if (H2H) return H2H;
      H2H = {};
      PLAYED.forEach(function (g) {
        var hw = g.hs > g.as, aw = g.as > g.hs;
        [[g.h, g.a, hw, aw], [g.a, g.h, aw, hw]].forEach(function (r) {
          var k = r[0] + '|' + r[1]; H2H[k] = H2H[k] || { w: 0, l: 0 };
          if (r[2]) H2H[k].w++; if (r[3]) H2H[k].l++;
        });
      });
      return H2H;
    }

    /* Who's pulling for whom in game j.
       1. Stake fans — combined stake = playoff odds + half the #1-seed swing + a quarter of
          the top-2 swing. 2+ points makes you a fan. Locked-in teams still care about seeding.
       2. Grudge fans — no real stake, but lost to one side this season (and did better against
          the other): they root against the team that beat them. */
    function fansFor(res, j) {
      var g = SCHED[j], out = { h: [], a: [] }, h2h = seasonH2H();
      for (var i = 0; i < TEAM_IDS.length; i++) {
        var o = TEAM_IDS[i];
        if (o === g.h || o === g.a) continue;
        var st = stakeFor(res, j, o);
        if (!st) return null;
        var u = st.po + 0.5 * st.t1 + 0.25 * st.t2;
        if (Math.abs(u) >= 2) {
          var side = u > 0 ? 'h' : 'a', sg = u > 0 ? 1 : -1;
          out[side].push({ id: o, pts: Math.round(Math.abs(u)), kind: 'stake',
            po: Math.round(st.po * sg), t1: Math.round(st.t1 * sg) });
          continue;
        }
        var vh = h2h[o + '|' + g.h] || { w: 0, l: 0 }, va = h2h[o + '|' + g.a] || { w: 0, l: 0 };
        var netH = vh.w - vh.l, netA = va.w - va.l;
        // Grudge: losing record vs one side, and no losing record vs the other
        if (Math.min(netH, netA) < 0 && Math.max(netH, netA) >= 0) {
          var enemy = netH < netA ? g.h : g.a, rec = netH < netA ? vh : va;
          out[netH < netA ? 'a' : 'h'].push({ id: o, pts: 0, kind: 'grudge', enemy: enemy, rec: rec });
        }
      }
      function order(x, y) { return (y.kind === 'stake') - (x.kind === 'stake') || y.pts - x.pts; }
      out.h.sort(order); out.a.sort(order);
      return out;
    }

    /* Mini logo: stake fans scale with how much is riding on it; grudge fans get a dashed ring */
    function fanHtml(fan, side) {
      var F = TEAMS[fan.id], size, op, tip;
      var verb = side.team + ' win' + (/s$/i.test(side.team) ? '' : 's');
      if (fan.kind === 'grudge') {
        size = 20; op = 0.9;
        tip = F.team + ': grudge pick. ' + TEAMS[fan.enemy].team + ' beat them ' + fan.rec.l + '\u2013' + fan.rec.w + ' this season';
      } else {
        var k = Math.min(1, (fan.pts - 2) / 20);
        size = Math.round(20 + k * 8); op = (0.85 + k * 0.15).toFixed(2);
        var bits = [];
        if (fan.po >= 1) bits.push('+' + fan.po + ' playoff odds');
        if (fan.t1 >= 2) bits.push('+' + fan.t1 + ' #1-seed odds');
        tip = F.team + ': ' + (bits.join(', ') || 'better seeding') + ' if ' + verb;
      }
      var inner = F.logo ? '<img src="' + esc(F.logo) + '" alt="" />' : '<span class="init">' + esc(initials(F.team)) + '</span>';
      return '<span class="race-fan' + (fan.kind === 'grudge' ? ' grudge' : '') + '" role="button" tabindex="0" data-tip="' + esc(tip) + '" title="' + esc(tip) + '" style="width:' + size + 'px;height:' + size + 'px;opacity:' + op + '">' + inner + '</span>';
    }

    /* ══════════════════════════════════════════════════════════
       MATCHUP SPOTLIGHT — opens inline under a Matchup Board game
    ══════════════════════════════════════════════════════════ */

    /* Total playoff-odds swing across the league for game j (0 if picked) */
    function gameSwing(res, j) {
      var tot = 0;
      for (var i = 0; i < TEAM_IDS.length; i++) {
        var c = condOdds(res, j, TEAM_IDS[i]); if (!c) return 0;
        tot += Math.abs(c.h - c.a);
      }
      return tot;
    }
    function autoSpot(res, week) {
      var best = null, bestSwing = 0;
      SCHED.forEach(function (g, j) {
        if (g.week !== week) return;
        var sw = gameSwing(res, j);
        if (sw > bestSwing) { bestSwing = sw; best = g.id; }
      });
      return best;
    }

    /* All-time OFC record between two members (regular season + real playoff games) */
    function allTime(aId, bId) {
      var r = { a: 0, b: 0, t: 0 };
      if (!OFC) return r;
      function tally(aS, bS) { if (aS > bS) r.a++; else if (bS > aS) r.b++; else r.t++; }
      (OFC.seasons || []).forEach(function (s) {
        (s.weeks || []).forEach(function (w) {
          if (!w.isComplete) return;
          (w.games || []).forEach(function (g) {
            var h = g.home || {}, a = g.away || {};
            if (h.memberId === aId && a.memberId === bId) tally(num(h.score), num(a.score));
            else if (h.memberId === bId && a.memberId === aId) tally(num(a.score), num(h.score));
          });
        });
        var p = s.playoffs || {};
        [['semis', 'Semifinal'], ['finals', 'Championship']].forEach(function (rd) {
          (p[rd[0]] || []).forEach(function (g) {
            if ((g.gameType || rd[1]) !== rd[1]) return;
            var hs = num(g.homeScore), as_ = num(g.awayScore);
            if (!hs && !as_) return;
            if (g.homeMemberId === aId && g.awayMemberId === bId) tally(hs, as_);
            else if (g.homeMemberId === bId && g.awayMemberId === aId) tally(as_, hs);
          });
        });
      });
      return r;
    }

    /* What a pick did to the race: compare against the same picks minus this one */
    var PICK_IMPACT = {};
    function pickImpact(gameId) {
      var key = gameId + '|' + JSON.stringify(state.picks);
      if (PICK_IMPACT[key]) return PICK_IMPACT[key];
      var without = {}; Object.keys(state.picks).forEach(function (k) { if (k !== gameId) without[k] = state.picks[k]; });
      PICK_IMPACT[key] = simulate(SIMS / 2, SCHED, without, MODEL, BASE, 20260);
      return PICK_IMPACT[key];
    }

    function fanLine(fan) {
      var F = TEAMS[fan.id];
      var why = fan.kind === 'grudge'
        ? 'grudge &middot; ' + esc(TEAMS[fan.enemy].team) + ' beat them ' + fan.rec.l + '&ndash;' + fan.rec.w
        : [fan.po >= 1 ? '+' + fan.po + ' playoff odds' : '', fan.t1 >= 2 ? '+' + fan.t1 + ' #1 seed' : ''].filter(Boolean).join(', ') || 'better seeding';
      return '<div class="race-spot-fan">' + (F.logo ? '<img src="' + esc(F.logo) + '" alt="" />' : '') +
        '<span><b>' + esc(F.team) + '</b><i>' + why + '</i></span></div>';
    }

    function spotlightHtml(res, x, isAuto) {
      var j = SCHED.indexOf(x), H = TEAMS[x.h], A = TEAMS[x.a], p = state.picks[x.id];
      var html = '<div class="race-spot" style="--ga:' + H.color + ';--gb:' + A.color + '">';
      html += '<div class="race-spot-tag">' + (isAuto ? '&#x2605; Game of the Week &middot; Biggest swing in Wk ' + x.week : 'Spotlight &middot; Week ' + x.week) + '</div>';

      var c = { h: condOdds(res, j, x.h), a: condOdds(res, j, x.a) };
      function sideHtml(id, which) {
        var t = TEAMS[id], body;
        if (!p) {
          var cc = c[which], win = which === 'h' ? cc.h : cc.a, lose = which === 'h' ? cc.a : cc.h;
          body = '<div class="race-spot-odds">Playoffs<br>Win <b class="' + oddsClass(win) + '">' + pctLabel(win) + '%</b> &middot; Lose <b class="' + oddsClass(lose) + '">' + pctLabel(lose) + '%</b></div>';
        } else {
          var before = pickImpact(x.id)[id].playoff, after = res[id].playoff, d = pct(after) - pct(before);
          body = '<div class="race-spot-odds">Playoffs<br><b>' + pctLabel(before) + '%</b> &rarr; <b class="' + oddsClass(after) + '">' + pctLabel(after) + '%</b>' +
            (d ? ' <span class="race-delta ' + (d > 0 ? 'up' : 'dn') + '">' + (d > 0 ? '&#x25B2;' : '&#x25BC;') + Math.abs(d) + '</span>' : '') + '</div>';
        }
        return '<div class="race-spot-side">' + teamLink(id, logo(t, 'race-spot-logo')) + '<div class="race-spot-name">' + esc(t.team) + '</div>' + body + '</div>';
      }
      html += '<div class="race-spot-grid">' + sideHtml(x.h, 'h') + '<div class="race-spot-vs">VS</div>' + sideHtml(x.a, 'a') + '</div>';

      if (!p) {
        var sh = Math.abs(c.h.h - c.h.a), sa = Math.abs(c.a.h - c.a.a);
        var big = sh >= sa ? H : A, swing = Math.max(sh, sa);
        html += '<p class="race-spot-line">&ldquo;' + (swing >= 0.1
          ? esc(big.team) + (/s$/i.test(big.team) ? '&rsquo;' : '&rsquo;s') + ' season swings ' + pct(swing) + ' points on this one. No pressure.'
          : 'Not much riding on this one. Bragging rights only.') + '&rdquo;</p>';
        var f = fansFor(res, j);
        if (f && (f.h.length || f.a.length)) {
          // One column under each team, split by a divider, so the sides are obvious
          html += '<div class="race-spot-label">Who&rsquo;s Pulling for Whom</div><div class="race-spot-fans">' +
            '<div class="race-spot-col h"><div class="race-spot-col-head">Pulling for ' + esc(H.team) + '</div>' +
              '<div class="race-spot-col-list">' + (f.h.length ? f.h.map(fanLine).join('') : '<p class="race-spot-none">Nobody</p>') + '</div></div>' +
            '<div class="race-spot-divide"><span>vs</span></div>' +
            '<div class="race-spot-col a"><div class="race-spot-col-head">Pulling for ' + esc(A.team) + '</div>' +
              '<div class="race-spot-col-list">' + (f.a.length ? f.a.map(fanLine).join('') : '<p class="race-spot-none">Nobody</p>') + '</div></div>' +
          '</div>';
        }
      } else {
        var w = p === 'h' ? H : A;
        html += '<p class="race-spot-line">Your pick: ' + esc(w.team) + ' win' + (/s$/i.test(w.team) ? '' : 's') + '. Tap the &times; on their box to clear it.</p>';
      }

      // This season + all-time
      var meet = PLAYED.filter(function (g) { return (g.h === x.h && g.a === x.a) || (g.h === x.a && g.a === x.h); });
      var at = allTime(x.h, x.a);
      var hist = meet.map(function (g) {
        var hs = g.h === x.h ? g.hs : g.as, as_ = g.h === x.h ? g.as : g.hs;
        return '<div class="race-spot-meet"><span>Wk ' + g.week + '</span><b class="' + (hs > as_ ? 'w' : '') + '">' + hs.toFixed(2) + '</b><i>&ndash;</i><b class="' + (as_ > hs ? 'w' : '') + '">' + as_.toFixed(2) + '</b></div>';
      }).join('');
      var lead = at.a > at.b ? esc(H.team) + ' lead ' + at.a + '&ndash;' + at.b : (at.b > at.a ? esc(A.team) + ' lead ' + at.b + '&ndash;' + at.a : 'Tied ' + at.a + '&ndash;' + at.b);
      html += '<div class="race-spot-label">History</div><div class="race-spot-hist">' +
        (hist ? '<div class="race-spot-meets">' + hist + '</div>' : '<p class="race-spot-none">First meeting this season</p>') +
        ((at.a + at.b + at.t) ? '<div class="race-spot-at">All-time: <b>' + lead + (at.t ? ' (' + at.t + ' tie' + (at.t > 1 ? 's' : '') + ')' : '') + '</b></div>' : '') +
        '<a class="race-gotw-link" href="rivals.html?a=' + encodeURIComponent(x.h) + '&b=' + encodeURIComponent(x.a) + '">Rivalry History &#x2197;</a>' +
      '</div>';
      return html + '</div>';
    }

    function teamLink(id, inner) {
      return '<a class="race-team-link" href="team.html?id=' + encodeURIComponent(id) + '" title="' + esc(TEAMS[id].team) + ' team page">' + inner + '</a>';
    }

    function logo(t, cls) {
      return t.logo ? '<img class="' + cls + '" src="' + esc(t.logo) + '" alt="" />'
                    : '<div class="race-logo-init">' + esc(initials(t.team)) + '</div>';
    }
    function rec(s) { return s.w + '–' + s.l + (s.t ? '–' + s.t : ''); }

    function render(res, hasPicks) {
      var wrap = document.getElementById('prWrap');
      var html = '';

      document.getElementById('prEyebrow').textContent = SEASON.year + ' OFC Season · After Week ' + LAST_DONE;
      document.getElementById('prSubtitle').textContent = (SIMS / 1000) + ',000 Simulated Seasons';

      /* ── Board ── */
      var SCEN = buildScenarios(SCHED, state.picks);
      var ranked = TEAM_IDS.slice().sort(function (a, b) {
        return (res[b].playoff - res[a].playoff) || (res[b].top - res[a].top) || (BASE[b].w - BASE[a].w) || (BASE[b].pf - BASE[a].pf);
      });
      html += '<p class="race-heading">Playoff Scenario Generator</p>' +
        '<div class="race-whatif-banner' + (hasPicks ? ' on' : '') + '"><span>&#x2726; What-If Mode · ' + Object.keys(state.picks).length + ' result' + (Object.keys(state.picks).length === 1 ? '' : 's') + ' picked</span><button class="race-btn" id="prReset">Reset</button></div>' +
        '<div class="race-panel race-board">' +
        ranked.map(function (id, i) {
          var t = TEAMS[id], r = res[id], b = BASE[id], base = BASELINE[id];
          var tag = '', cs = CLINCH[id];
          if (cs === 'y') tag = '<span class="race-tag lock" title="Mathematically clinched the #1 seed">Clinched #1</span>';
          else if (cs === 'x') tag = '<span class="race-tag lock" title="Mathematically clinched a playoff berth">Clinched</span>';
          else if (cs === 'e') tag = '<span class="race-tag out" title="Mathematically eliminated">Eliminated</span>';
          else if (r.playoff >= 0.999) tag = '<span class="race-tag lock">Lock</span>';
          else if (r.playoff <= 0.001) tag = '<span class="race-tag out">Toast</span>';
          else if (r.playoff >= 0.3 && r.playoff <= 0.7) tag = '<span class="race-tag bubble">Bubble</span>';
          var d = hasPicks ? pct(r.playoff) - pct(base.playoff) : 0;
          var delta = d ? '<span class="race-delta ' + (d > 0 ? 'up' : 'dn') + '">' + (d > 0 ? '▲' : '▼') + Math.abs(d) + '</span>' : '';
          var seeds = r.seeds.map(function (p, si) {
            var cls = si < 4 ? 's' + (si + 1) : 'out';
            var label = p >= 0.09 ? (si < 4 ? '#' + (si + 1) + ' ' : '') + pct(p) + '%' : '';
            return '<span class="' + cls + '" style="width:' + (p * 100).toFixed(2) + '%" title="' + (si < 4 ? 'Seed ' + (si + 1) : 'Miss') + ': ' + pct(p) + '%">' + label + '</span>';
          }).join('');
          var open = state.open === id;
          return '<div class="race-row' + (i === PLAYOFF_TEAMS - 1 ? ' cutline' : '') + (open ? ' is-open' : '') + '" style="--tc:' + t.color + '" data-team="' + esc(id) + '" role="button" tabindex="0" aria-expanded="' + open + '">' +
            '<div class="race-row-top">' +
              '<span class="race-rank">' + (i + 1) + '</span>' +
              teamLink(id, logo(t, 'race-logo')) +
              '<div class="race-team"><div class="race-team-name">' + esc(t.team) + tag + '</div>' +
                '<div class="race-team-meta"><b>' + rec(b) + '</b> · ' + b.pf.toFixed(1) + ' PF · Proj ' + r.projW.toFixed(1) + ' W</div></div>' +
              '<div class="race-odds"><div class="race-odds-num">' + delta + pctLabel(r.playoff) + '<small>%</small></div><div class="race-odds-lbl">Playoffs</div></div>' +
            '</div>' +
            '<div class="race-seeds">' + seeds + '</div>' +
            '<div class="race-path-toggle">' + (open ? 'Hide path &#x25B4;' : 'Path to the playoffs &#x25BE;') + '</div>' +
            (open ? pathPanel(id, res, SCEN) : '') +
            (i === PLAYOFF_TEAMS - 1 ? '<span class="race-cut-label">Playoff Line</span>' : '') +
          '</div>';
        }).join('') +
        '</div>' +
        '<div class="race-seed-key"><span>Bar = chance of each seed</span><span>Brightest = #1 seed &middot; empty = miss</span></div>';

      /* ── Matchup Board ── */
      var weeks = []; SCHED.forEach(function (x) { if (weeks.indexOf(x.week) === -1) weeks.push(x.week); });
      if (state.tabWeek === null || weeks.indexOf(state.tabWeek) === -1) state.tabWeek = weeks[0];
      html += '<p class="race-heading">Matchup Board</p>' +
        '<p class="race-intro">Selecting a team to win instantly updates the odds in the Playoff Scenario Generator above.<br>Small logos under a team show which teams are pulling for them to win the matchup. Tap <b>vs</b> to see the spotlight for that matchup.</p>';
      if (weeks.length) {
        html += '<div class="race-tabs">' + weeks.map(function (wk) {
          var has = SCHED.some(function (x) { return x.week === wk && state.picks[x.id]; });
          return '<button class="race-tab' + (wk === state.tabWeek ? ' is-active' : '') + '" data-week="' + wk + '">Wk ' + wk + (has ? '<span class="dot"></span>' : '') + '</button>';
        }).join('') + '</div>';
        var hw = res._homeWinPct;
        var spotAuto = state.spot === undefined;
        var spotId = spotAuto ? autoSpot(res, state.tabWeek) : state.spot;
        html += '<div class="race-games">' + SCHED.filter(function (x) { return x.week === state.tabWeek; }).map(function (x) {
          var H = TEAMS[x.h], A = TEAMS[x.a], p = state.picks[x.id];
          var hp = hw[x.id], ap = 1 - hp;
          var f = fansFor(res, SCHED.indexOf(x));   // null once the game is picked
          var isSpot = x.id === spotId;
          function side(t, which, prob) {
            var cls = 'race-pick ' + (which === 'a' ? 'b' : 'a') + (p === which ? ' won' : (p ? ' lost' : ''));
            var fans = f ? f[which] : [];
            return '<div class="' + cls + '" role="button" tabindex="0" style="--tc:' + t.color + '" data-game="' + x.id + '" data-side="' + which + '">' +
              (p === which ? '<span class="race-pick-x" data-clear="' + x.id + '" role="button" tabindex="0" title="Clear pick" aria-label="Clear pick">&times;</span>' : '') +
              '<div class="race-pick-main">' + logo(t, 'race-pick-logo') +
                '<span class="race-pick-txt"><div class="race-pick-name">' + esc(t.team) + '</div>' +
                '<div class="race-pick-pct">' + (p ? (p === which ? 'Picked to win' : 'Picked to lose') : pct(prob) + '% to win') + '</div></span>' +
              '</div>' +
              (fans.length ? '<div class="race-fans">' + fans.map(function (fan) { return fanHtml(fan, t); }).join('') + '</div>' : '') +
              '</div>';
          }
          var mid = '<button class="race-game-mid' + (isSpot ? ' is-spot' : '') + (p ? ' set' : '') + '" data-spot="' + x.id + '" aria-expanded="' + isSpot + '" title="' + (isSpot ? 'Close spotlight' : 'Spotlight this matchup') + '">' +
            '<span class="vs">vs</span><span class="caret">' + (isSpot ? '&#x25B4;' : '&#x25BE;') + '</span></button>';
          return '<div class="race-game">' + side(H, 'h', hp) + mid + side(A, 'a', ap) + '</div>' +
            (isSpot ? spotlightHtml(res, x, spotAuto) : '');
        }).join('') + '</div>' +
        '<div class="race-fans-key"><span><i></i>Stake &middot; bigger = more</span><span><i class="g"></i>Grudge pick</span></div>';
      } else {
        html += '<p class="race-empty">Regular season complete — no games left to pick.</p>';
      }

      /* ── Settings + method ── */
      html += '<div class="race-settings">Regular season: ' + REG_WEEKS + ' weeks &middot; playoffs start Week ' + (REG_WEEKS + 1) + '</div>' +
        '<p class="race-method">Each team&rsquo;s weekly score is drawn from its ' + SEASON.year + ' scoring average and spread, ' +
        'pulled slightly toward the league average so a hot or cold start doesn&rsquo;t over-count. ' +
        (SCHEDULE_SOURCE === 'pattern'
          ? 'Remaining matchups follow Yahoo&rsquo;s repeating schedule (every ' + CYCLE + ' weeks the cycle starts over). '
          : 'Remaining matchups come from the loaded schedule. ') +
        'Top ' + PLAYOFF_TEAMS + ' make the playoffs; ties broken by points for. &ldquo;Clinched&rdquo; and &ldquo;Eliminated&rdquo; are locked in by real results, not simulations.</p>';

      wrap.innerHTML = html;
      bind();
    }

    /* Small floating tooltip for fan logos */
    var tipEl = null, tipTimer = null;
    function showTip(el) {
      if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'race-tip'; document.body.appendChild(tipEl); }
      tipEl.textContent = el.getAttribute('data-tip');
      tipEl.classList.add('on');
      var r = el.getBoundingClientRect(), w = tipEl.offsetWidth;
      var left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2));
      tipEl.style.left = left + 'px';
      tipEl.style.top = Math.max(8, r.top - tipEl.offsetHeight - 8) + 'px';
      clearTimeout(tipTimer); tipTimer = setTimeout(hideTip, 2600);
    }
    function hideTip() { if (tipEl) tipEl.classList.remove('on'); }
    document.addEventListener('scroll', hideTip, { passive: true });
    document.addEventListener('click', function (e) { if (!(e.target.closest && e.target.closest('.race-fan'))) hideTip(); });

    function bind() {
      var wrap = document.getElementById('prWrap');
      wrap.querySelectorAll('.race-pick').forEach(function (b) {
        function pick(e) {
          var fan = e.target.closest ? e.target.closest('.race-fan') : null;
          if (fan) { e.stopPropagation(); showTip(fan); return; }
          if (e.target.closest && e.target.closest('[data-clear]')) return;   // the × handles itself
          var id = b.getAttribute('data-game'), side = b.getAttribute('data-side');
          if (state.picks[id] === side) delete state.picks[id]; else state.picks[id] = side;
          hideTip(); recompute(false);
        }
        b.addEventListener('click', pick);
        b.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(e); } });
      });
      wrap.querySelectorAll('[data-clear]').forEach(function (b) {
        b.addEventListener('click', function (e) { e.stopPropagation(); delete state.picks[b.getAttribute('data-clear')]; recompute(false); });
      });
      wrap.querySelectorAll('[data-spot]').forEach(function (b) {
        b.addEventListener('click', function () {
          var id = b.getAttribute('data-spot');
          var open = b.classList.contains('is-spot');
          state.spot = open ? 'none' : id;
          render(LAST.res, LAST.hasPicks);
          var el = document.querySelector('.race-spot');
          if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        });
      });
      wrap.querySelectorAll('.race-tab').forEach(function (b) {
        b.addEventListener('click', function () { state.tabWeek = parseInt(b.getAttribute('data-week'), 10); state.spot = undefined; recompute(false); });
      });
      wrap.querySelectorAll('.race-row').forEach(function (row) {
        function toggle(e) {
          if (e.target.closest && e.target.closest('a')) return;   // logo → team page
          var id = row.getAttribute('data-team');
          state.open = state.open === id ? null : id;
          render(LAST.res, LAST.hasPicks);
          var el = document.querySelector('.race-row[data-team="' + id + '"]');
          if (el && state.open) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
        row.addEventListener('click', toggle);
        row.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(e); } });
      });
      var reset = document.getElementById('prReset');
      if (reset) reset.addEventListener('click', function () { state.picks = {}; recompute(false); });
    }

    function init() {
      var config = window.SITE_CONFIG || {};
      var ov = document.getElementById('prOverlay');
      if (ov && config.slideshow && config.slideshow.overlay) ov.style.background = config.slideshow.overlay;
      var foot = document.getElementById('prFooter');
      if (foot) { if (config.footer && config.footer.show) foot.textContent = config.footer.text; else foot.style.display = 'none'; }
      if (!SEASON || TEAM_IDS.length < 2 || !PLAYED.length) {
        document.getElementById('prWrap').innerHTML = '<p class="race-empty">No OFC season in progress. The race starts in Week 1.</p>';
        return;
      }
      recompute(true);
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();
  </script>
</body>
</html>
