<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="OFC Playoff Race — live playoff odds from 10,000 simulated seasons." />
  <title>OFL — Playoff Race</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="admin-config.js"></script>
  <script src="ofl-data.js"></script>
  <script src="admin.js"></script>

  <style>
    /* ══════════════════════════════════════════════════════════
       PLAYOFF RACE — all classes prefixed race-
    ══════════════════════════════════════════════════════════ */
    .race-page { position: relative; width: 100%; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    .race-page > .slide-layer      { position: fixed; inset: 0; z-index: 0; height: 100%; }
    .race-page > .landing-overlay  { position: fixed; inset: 0; z-index: 10; height: 100%; pointer-events: none; }
    .race-page > .landing-vignette { position: fixed; inset: 0; z-index: 11; height: 100%; pointer-events: none; }

    .race-hero { position: relative; z-index: 20; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 5rem 2rem 1.4rem; }
    .race-hero-eyebrow {
      font-family: var(--font-body); font-weight: 300; font-size: var(--size-eyebrow, 8pt);
      letter-spacing: 0.45em; text-transform: uppercase; color: var(--accent-dim); margin-bottom: 0.9rem;
      opacity: 0; animation: heroReveal 1.2s 0.2s ease forwards;
    }
    .race-hero-title {
      font-family: var(--font-display); font-weight: 300; font-size: var(--size-title, 72pt);
      line-height: 0.92; letter-spacing: -0.02em; color: var(--accent); margin-bottom: 0.8rem;
      opacity: 0; animation: heroReveal 1.2s 0.4s ease forwards;
    }
    .race-hero-subtitle {
      font-family: var(--font-body); font-weight: 200; font-size: var(--size-subtitle, 10pt);
      letter-spacing: 0.35em; text-transform: uppercase; color: var(--accent-dim);
      opacity: 0; animation: heroReveal 1.2s 0.55s ease forwards;
    }

    .race-body { position: relative; z-index: 20; flex: 1; padding: 0 0 5rem; }
    .race-wrap { max-width: 900px; margin: 0 auto; padding: 0 2rem; }
    .race-heading {
      font-family: var(--font-body); font-weight: var(--weight-section-heading, 300);
      font-size: var(--size-section-heading, 7pt); letter-spacing: 0.4em; text-transform: uppercase;
      color: var(--hint-color, var(--accent-dim)); margin: 2.4rem 0 1rem; padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--drawer-border); text-align: center;
    }
    .race-panel {
      border: 1px solid var(--drawer-border); background: rgba(0,0,0,0.38);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }

    /* ── What-if banner ───────────────────────────────────── */
    .race-whatif-banner {
      display: none; align-items: center; justify-content: space-between; gap: 0.8rem;
      padding: 0.6rem 0.9rem; margin-bottom: 0.6rem;
      border: 1px solid rgba(232,200,100,0.45); background: rgba(232,200,100,0.07);
      font-family: var(--font-body); font-size: 0.55rem; letter-spacing: 0.22em; text-transform: uppercase; color: #e8c864;
    }
    .race-whatif-banner.on { display: flex; }
    .race-btn {
      font-family: var(--font-body); font-size: 0.52rem; letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--accent); background: rgba(0,0,0,0.45); border: 1px solid var(--drawer-border);
      padding: 0.35rem 0.75rem; cursor: pointer; transition: border-color 0.2s, background 0.2s;
    }
    .race-btn:hover { border-color: rgba(232,232,232,0.35); background: rgba(255,255,255,0.05); }

    /* ── The board ────────────────────────────────────────── */
    .race-board { display: flex; flex-direction: column; }
    .race-row {
      position: relative; padding: 0.75rem 0.9rem 0.7rem;
      border-bottom: 1px solid rgba(232,232,232,0.05);
      transition: background 0.25s;
    }
    .race-row::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--tc, transparent);
    }
    .race-row:last-child { border-bottom: none; }
    .race-row.cutline { border-bottom: 1px dashed rgba(232,200,100,0.55); }
    .race-cut-label {
      position: absolute; right: 0.6rem; bottom: -0.5rem; z-index: 2;
      font-family: var(--font-body); font-size: 0.42rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: #e8c864; background: #0a0a0a; padding: 0 0.4rem;
    }
    .race-row-top { display: grid; grid-template-columns: 1.4rem 44px 1fr auto; align-items: center; gap: 0.7rem; }
    .race-rank { font-family: var(--font-display); font-size: 1.1rem; color: var(--accent-dim); text-align: center; }
    .race-logo { width: 44px; height: 44px; object-fit: contain; }
    .race-logo-init { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); color: var(--accent-dim); border: 1px solid var(--drawer-border); }
    .race-team { min-width: 0; }
    .race-team-name {
      font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; color: var(--accent);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1;
    }
    .race-team-meta {
      font-family: var(--font-body); font-size: 0.5rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--accent-dim); margin-top: 0.2rem;
    }
    .race-team-meta b { color: var(--accent); font-weight: 700; }
    .race-odds { text-align: right; }
    .race-odds-num { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1; color: var(--accent); }
    .race-odds-num small { font-size: 0.9rem; font-weight: 400; opacity: 0.7; }
    .race-odds-lbl { font-family: var(--font-body); font-size: 0.42rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent-dim); margin-top: 0.15rem; }
    .race-delta { display: inline-block; font-family: var(--font-body); font-size: 0.55rem; font-weight: 700; margin-right: 0.35rem; vertical-align: middle; }
    .race-delta.up { color: #4caf7d; } .race-delta.dn { color: #d94f4f; }
    .race-tag {
      display: inline-block; font-family: var(--font-body); font-size: 0.42rem; letter-spacing: 0.25em;
      text-transform: uppercase; padding: 0.12rem 0.4rem; border: 1px solid; margin-left: 0.4rem; vertical-align: middle;
    }
    .race-tag.lock { color: #4caf7d; border-color: rgba(76,175,125,0.6); }
    .race-tag.out  { color: #d94f4f; border-color: rgba(217,79,79,0.6); }
    .race-tag.bubble { color: #e8c864; border-color: rgba(232,200,100,0.6); }

    .race-row { cursor: pointer; }
    .race-row:hover { background: rgba(255,255,255,0.02); }
    .race-row.is-open { background: rgba(255,255,255,0.03); }
    .race-team-link { display: block; line-height: 0; transition: transform 0.2s; }
    .race-team-link:hover { transform: scale(1.08); }
    .race-path-toggle {
      margin-top: 0.4rem; text-align: right;
      font-family: var(--font-body); font-size: 0.44rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--accent-dim); opacity: 0.7;
    }
    .race-row:hover .race-path-toggle, .race-row.is-open .race-path-toggle { opacity: 1; color: var(--accent); }

    /* ── Path to the playoffs panel ── */
    .race-path { cursor: default; margin-top: 0.6rem; padding-top: 0.7rem; border-top: 1px solid var(--drawer-border); animation: heroReveal 0.4s ease; }
    .race-path-head { font-family: var(--font-display); font-weight: 300; font-size: 1rem; line-height: 1.35; color: var(--accent); }
    .race-path-head b { font-weight: 700; color: var(--tc); }
    .race-path-label {
      margin: 0.9rem 0 0.45rem; font-family: var(--font-body); font-size: 0.46rem; letter-spacing: 0.32em;
      text-transform: uppercase; color: var(--hint-color, var(--accent-dim));
    }
    .race-path-note { font-family: var(--font-body); font-size: 0.5rem; letter-spacing: 0.06em; color: var(--accent-dim); opacity: 0.8; margin-top: 0.4rem; line-height: 1.5; }
    .race-wins { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .race-win-chip {
      display: flex; flex-direction: column; align-items: center; min-width: 3.6rem; padding: 0.35rem 0.45rem;
      border: 1px solid var(--drawer-border); background: rgba(0,0,0,0.35);
    }
    .race-win-chip .rec { font-family: var(--font-body); font-size: 0.5rem; letter-spacing: 0.12em; color: var(--accent-dim); }
    .race-win-chip .pct { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; line-height: 1.15; }
    .race-win-chip .fin { font-family: var(--font-body); font-size: 0.4rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent-dim); opacity: 0.7; }
    .race-win-chip.g { border-color: rgba(76,175,125,0.5); }  .race-win-chip.g .pct, b.g { color: #4caf7d; }
    .race-win-chip.y { border-color: rgba(232,200,100,0.45); } .race-win-chip.y .pct, b.y { color: #e8c864; }
    .race-win-chip.o { border-color: rgba(224,148,74,0.4); }  .race-win-chip.o .pct, b.o { color: #e0944a; }
    .race-win-chip.r { border-color: rgba(217,79,79,0.35); }  .race-win-chip.r .pct, b.r { color: #d94f4f; }
    .race-root {
      display: flex; justify-content: space-between; align-items: baseline; gap: 0.8rem;
      padding: 0.35rem 0; border-bottom: 1px solid rgba(232,232,232,0.05);
      font-family: var(--font-body); font-size: 0.62rem; color: var(--accent-dim);
    }
    .race-root:last-of-type { border-bottom: none; }
    .race-root .who { color: var(--accent); min-width: 0; }
    .race-root.own .who { font-weight: 700; color: var(--tc); filter: brightness(1.35); }
    .race-root .val { text-align: right; white-space: nowrap; font-size: 0.55rem; }
    .race-root .val b { font-family: var(--font-display); font-size: 0.85rem; font-weight: 700; }
    .race-scn { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3rem 0.45rem; padding: 0.3rem 0; font-family: var(--font-body); font-size: 0.62rem; color: var(--accent); line-height: 1.5; }
    .race-scn .k { font-size: 0.46rem; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700; margin-right: 0.2rem; }
    .race-scn.in .k { color: #4caf7d; } .race-scn.out .k { color: #d94f4f; }
    .race-scn .or { font-size: 0.44rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-dim); }
    .race-scn em { font-style: normal; color: var(--accent-dim); }
    @media (max-width: 600px) {
      .race-root { flex-direction: column; gap: 0.1rem; }
      .race-root .val { text-align: left; }
      .race-win-chip { min-width: 3.2rem; padding: 0.3rem 0.35rem; }
    }

    /* Spoiler duty */
    .race-spoil-head { font-family: var(--font-body); font-size: 0.66rem; color: var(--accent); line-height: 1.5; margin-bottom: 0.35rem; }
    .race-spoil-head b { font-weight: 700; filter: brightness(1.35); }
    .race-spoil {
      display: grid; grid-template-columns: 2.6rem 1fr auto; align-items: center; gap: 0.6rem;
      padding: 0.45rem 0; border-bottom: 1px solid rgba(232,232,232,0.05);
      font-family: var(--font-body);
    }
    .race-spoil:last-child { border-bottom: none; }
    .race-spoil .wk { font-size: 0.5rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent-dim); }
    .race-spoil .opp { display: flex; flex-direction: column; font-size: 0.66rem; color: var(--accent); min-width: 0; }
    .race-spoil .odds { font-size: 0.5rem; letter-spacing: 0.05em; color: var(--accent-dim); margin-top: 0.1rem; }
    .race-spoil .helps { font-size: 0.48rem; letter-spacing: 0.05em; color: var(--accent-dim); opacity: 0.8; margin-top: 0.1rem; }
    .race-spoil .helps b { color: #4caf7d; }
    .race-spoil .dmg { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: var(--accent-dim); text-align: right; }
    .race-spoil .dmg.big { color: #e0944a; }

    /* Seed distribution bar */
    .race-seeds { display: flex; height: 16px; margin-top: 0.6rem; background: rgba(232,232,232,0.05); overflow: hidden; }
    .race-seeds span {
      display: flex; align-items: center; justify-content: center; height: 100%;
      font-family: var(--font-body); font-size: 0.42rem; font-weight: 700; letter-spacing: 0.05em;
      color: rgba(255,255,255,0.92); text-shadow: 0 0 3px rgba(0,0,0,0.9);
      overflow: hidden; white-space: nowrap; transition: width 0.6s cubic-bezier(.2,.8,.2,1);
    }
    .race-seeds .s1 { background: var(--tc); }
    .race-seeds .s2 { background: color-mix(in srgb, var(--tc) 72%, #0a0a0a); }
    .race-seeds .s3 { background: color-mix(in srgb, var(--tc) 50%, #0a0a0a); }
    .race-seeds .s4 { background: color-mix(in srgb, var(--tc) 32%, #0a0a0a); }
    .race-seeds .out { background: transparent; color: var(--accent-dim); text-shadow: none; }
    .race-seed-key {
      display: flex; justify-content: space-between; margin-top: 0.25rem;
      font-family: var(--font-body); font-size: 0.42rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent-dim);
    }

    /* ── Game of the week ─────────────────────────────────── */
    .race-gotw { padding: 1.1rem 1rem 1rem; text-align: center; position: relative; overflow: hidden; }
    .race-gotw::before, .race-gotw::after { content: ''; position: absolute; top: 0; bottom: 0; width: 50%; opacity: 0.2; pointer-events: none; }
    .race-gotw::before { left: 0; background: linear-gradient(90deg, var(--ga, transparent), transparent); }
    .race-gotw::after  { right: 0; background: linear-gradient(270deg, var(--gb, transparent), transparent); }
    .race-gotw-tag { font-family: var(--font-body); font-size: 0.5rem; letter-spacing: 0.35em; text-transform: uppercase; color: #e8c864; margin-bottom: 0.8rem; position: relative; }
    .race-gotw-grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0.6rem; position: relative; }
    .race-gotw-side img, .race-gotw-side .race-logo-init { width: 72px; height: 72px; object-fit: contain; margin: 0 auto; }
    .race-gotw-name { font-family: var(--font-display); font-weight: 600; font-size: 1rem; color: var(--accent); margin-top: 0.4rem; }
    .race-gotw-swing { font-family: var(--font-body); font-size: 0.5rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent-dim); margin-top: 0.35rem; line-height: 1.7; }
    .race-gotw-swing b { font-family: var(--font-display); font-size: 0.95rem; letter-spacing: 0; color: var(--accent); }
    .race-gotw-vs { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; color: var(--accent); }
    .race-gotw-line { font-family: var(--font-display); font-style: italic; font-weight: 300; font-size: 1rem; color: var(--accent); margin-top: 0.9rem; position: relative; line-height: 1.35; }
    .race-gotw-link {
      display: inline-block; margin-top: 0.7rem; position: relative;
      font-family: var(--font-body); font-size: 0.5rem; letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--accent-dim); text-decoration: none; border-bottom: 1px solid var(--drawer-border); padding-bottom: 0.1rem;
    }
    .race-gotw-link:hover { color: var(--accent); }

    /* ── Matchup Board ─────────────────────────────────────────── */
    .race-intro { font-family: var(--font-body); font-size: 0.6rem; letter-spacing: 0.1em; color: var(--accent-dim); text-align: center; line-height: 1.6; margin-bottom: 0.9rem; }
    .race-tabs { display: flex; gap: 0.35rem; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 0.5rem; margin-bottom: 0.4rem; justify-content: center; flex-wrap: wrap; }
    .race-tab {
      font-family: var(--font-body); font-size: 0.55rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--accent-dim); background: transparent; border: 1px solid var(--drawer-border);
      padding: 0.35rem 0.7rem; cursor: pointer; position: relative; white-space: nowrap;
    }
    .race-tab.is-active { color: var(--accent); border-color: var(--accent); background: rgba(232,232,232,0.06); }
    .race-tab .dot { position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: #e8c864; }
    .race-games { display: flex; flex-direction: column; gap: 0.5rem; max-width: 680px; margin: 0 auto; }
    .race-game { display: grid; grid-template-columns: 1fr 2.8rem 1fr; align-items: stretch; gap: 0.4rem; }
    /* Each box: a fixed main row (name · logo) on top, fans underneath, so names and logos
       line up across every row no matter how many fans a side has */
    .race-pick {
      --logo: 30px;
      display: flex; flex-direction: column; justify-content: flex-start; gap: 0.35rem;
      padding: 0.55rem 0.7rem; border: 1px solid var(--drawer-border); background: rgba(0,0,0,0.4); cursor: pointer;
      color: inherit; font: inherit; min-width: 0; text-align: right;
      transition: border-color 0.2s, background 0.2s, opacity 0.2s;
    }
    .race-pick.b { text-align: left; }
    .race-pick-main { display: flex; align-items: center; gap: 0.6rem; height: var(--logo); flex-direction: row-reverse; justify-content: flex-start; min-width: 0; }
    .race-pick.b .race-pick-main { flex-direction: row; }
    .race-pick .race-pick-logo, .race-pick .race-logo-init { width: var(--logo); height: var(--logo); object-fit: contain; flex-shrink: 0; }
    .race-pick .race-logo-init { font-size: 0.7rem; }
    .race-pick-txt { min-width: 0; }
    .race-pick-name { font-family: var(--font-display); font-weight: 600; font-size: 0.85rem; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.15; }
    .race-pick-pct { font-family: var(--font-body); font-size: 0.45rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent-dim); }
    .race-pick.won { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 22%, rgba(0,0,0,0.5)); }
    .race-pick.lost { opacity: 0.35; }

    /* Middle column: "vs" sits level with the team logos (top-aligned, same row height) */
    .race-game-mid {
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding: calc(0.55rem + 1px) 0 0; background: none; cursor: default;
      font-family: var(--font-body); font-size: 0.45rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-dim);
      border: 1px dashed rgba(232,232,232,0.1);
    }
    .race-game-mid .vs { height: 30px; display: flex; align-items: center; }
    /* The middle is the spotlight toggle */
    .race-game-mid { cursor: pointer; border: 1px solid rgba(232,232,232,0.14); transition: border-color 0.2s, background 0.2s, color 0.2s; }
    .race-game-mid:hover { border-color: rgba(232,232,232,0.4); color: var(--accent); background: rgba(255,255,255,0.03); }
    .race-game-mid .caret { font-size: 0.55rem; letter-spacing: 0; opacity: 0.7; }
    .race-game-mid.is-spot { border-color: rgba(232,200,100,0.7); color: #e8c864; background: rgba(232,200,100,0.06); }
    .race-pick { position: relative; }
    .race-pick-x {
      position: absolute; top: 3px; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; line-height: 1; color: var(--accent); background: rgba(0,0,0,0.55);
      border: 1px solid rgba(232,232,232,0.3); border-radius: 50%; cursor: pointer; z-index: 2;
    }
    .race-pick.a .race-pick-x { left: 3px; }
    .race-pick.b .race-pick-x { right: 3px; }
    .race-pick-x:hover { border-color: var(--accent); }

    /* Inline spotlight */
    .race-spot {
      position: relative; overflow: hidden; margin: -0.15rem 0 0.2rem; padding: 1rem 1rem 1.1rem;
      border: 1px solid rgba(232,200,100,0.45); background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); text-align: center; animation: heroReveal 0.35s ease;
    }
    .race-spot::before, .race-spot::after { content: ''; position: absolute; top: 0; bottom: 0; width: 50%; opacity: 0.18; pointer-events: none; }
    .race-spot::before { left: 0; background: linear-gradient(90deg, var(--ga), transparent); }
    .race-spot::after  { right: 0; background: linear-gradient(270deg, var(--gb), transparent); }
    .race-spot > * { position: relative; z-index: 1; }
    .race-spot-tag { font-family: var(--font-body); font-size: 0.48rem; letter-spacing: 0.32em; text-transform: uppercase; color: #e8c864; margin-bottom: 0.8rem; }
    .race-spot-grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 0.6rem; }
    .race-spot-side .race-team-link { display: inline-block; }
    .race-spot .race-spot-logo, .race-spot-side .race-logo-init { width: 64px; height: 64px; object-fit: contain; margin: 0 auto; }
    .race-spot-name { font-family: var(--font-display); font-weight: 600; font-size: 1rem; color: var(--accent); margin-top: 0.35rem; }
    .race-spot-odds { font-family: var(--font-body); font-size: 0.48rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent-dim); margin-top: 0.3rem; line-height: 1.8; }
    .race-spot-odds b { font-family: var(--font-display); font-size: 0.95rem; letter-spacing: 0; color: var(--accent); }
    .race-spot-vs { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; color: var(--accent); padding-top: 1.2rem; }
    .race-spot-line { font-family: var(--font-display); font-style: italic; font-weight: 300; font-size: 0.95rem; color: var(--accent); margin-top: 0.8rem; line-height: 1.35; }
    .race-spot-label { margin: 1rem 0 0.5rem; font-family: var(--font-body); font-size: 0.46rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--hint-color, var(--accent-dim)); }
    .race-spot-fans { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0 1.1rem; align-items: stretch; }
    .race-spot-col {
      display: flex; flex-direction: column; align-items: center; min-width: 0;
      padding: 0.6rem 0.5rem 0.5rem; background: rgba(0,0,0,0.35); border: 1px solid var(--drawer-border);
      border-top: 2px solid var(--side);
    }
    .race-spot-col.h { --side: var(--ga); }
    .race-spot-col.a { --side: var(--gb); }
    .race-spot-col-head {
      font-family: var(--font-body); font-size: 0.44rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 0.45rem; text-align: center;
    }
    .race-spot-col-list { display: flex; flex-direction: column; align-items: flex-start; text-align: left; max-width: 100%; }
    .race-spot-divide { display: flex; align-items: center; justify-content: center; position: relative; }
    .race-spot-divide::before { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: linear-gradient(to bottom, transparent, rgba(232,232,232,0.3), transparent); }
    .race-spot-divide span {
      position: relative; padding: 0.2rem 0; background: #0a0a0a;
      font-family: var(--font-body); font-size: 0.42rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-dim);
    }
    .race-spot-fan { display: flex; align-items: center; gap: 0.45rem; padding: 0.25rem 0; }
    .race-spot-fan img { width: 22px; height: 22px; object-fit: contain; flex-shrink: 0; }
    .race-spot-fan span { display: flex; flex-direction: column; min-width: 0; }
    .race-spot-fan b { font-family: var(--font-body); font-size: 0.6rem; font-weight: 700; color: var(--accent); }
    .race-spot-fan i { font-style: normal; font-family: var(--font-body); font-size: 0.46rem; letter-spacing: 0.06em; color: var(--accent-dim); }
    .race-spot-none { font-family: var(--font-body); font-size: 0.55rem; color: var(--accent-dim); opacity: 0.7; }
    .race-spot-hist { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; }
    .race-spot-meets { display: flex; flex-direction: column; gap: 0.15rem; }
    .race-spot-meet { display: grid; grid-template-columns: 2.6rem 4rem 0.8rem 4rem; align-items: baseline; font-family: var(--font-body); font-size: 0.55rem; color: var(--accent-dim); }
    .race-spot-meet b { font-family: var(--font-display); font-size: 0.9rem; font-weight: 400; color: var(--accent-dim); }
    .race-spot-meet b:first-of-type { text-align: right; }
    .race-spot-meet b.w { color: var(--accent); font-weight: 700; }
    .race-spot-meet i { font-style: normal; text-align: center; }
    .race-spot-at { font-family: var(--font-body); font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-dim); }
    .race-spot-at b { color: var(--accent); }

    /* Fans row: biggest stake nearest the center */
    .race-fans { display: flex; align-items: center; gap: 0.25rem; flex-wrap: wrap; flex-direction: row-reverse; justify-content: flex-start; }
    .race-pick.b .race-fans { flex-direction: row; }
    .race-fan {
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: help;
      transition: transform 0.15s; filter: drop-shadow(0 0 3px rgba(0,0,0,0.9));
    }
    .race-fan:hover { transform: scale(1.2); opacity: 1 !important; }
    .race-pick .race-fan img { width: 100%; height: 100%; object-fit: contain; }
    .race-fan.grudge { border: 1px dashed rgba(232,232,232,0.55); border-radius: 50%; padding: 2px; }
    .race-fan .init {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 50%;
      border: 1px solid var(--drawer-border); font-family: var(--font-body); font-size: 0.32rem; color: var(--accent);
    }
    .race-fans-key {
      display: flex; justify-content: center; gap: 1.2rem; margin-top: 0.7rem; margin-bottom: 2.4rem;
      font-family: var(--font-body); font-size: 0.46rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent-dim);
    }
    .race-fans-key span { display: inline-flex; align-items: center; gap: 0.35rem; }
    .race-fans-key i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: rgba(232,232,232,0.5); }
    .race-fans-key i.g { background: none; border: 1px dashed rgba(232,232,232,0.7); }
    .race-tip {
      position: fixed; z-index: 300; pointer-events: none; max-width: 240px;
      padding: 0.35rem 0.6rem; background: #111; border: 1px solid rgba(232,232,232,0.25);
      font-family: var(--font-body); font-size: 0.6rem; letter-spacing: 0.04em; color: var(--accent);
      opacity: 0; transform: translateY(4px); transition: opacity 0.15s, transform 0.15s;
    }
    .race-tip.on { opacity: 1; transform: none; }

    .race-settings {
      display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.6rem;
      margin-top: 1rem; padding-top: 1.2rem; border-top: 1px solid var(--drawer-border);
      font-family: var(--font-body); font-size: 0.52rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-dim);
    }
    .race-settings select {
      font-family: var(--font-body); font-size: 0.6rem; color: var(--accent); background: #111;
      border: 1px solid var(--drawer-border); padding: 0.25rem 0.4rem;
    }
    .race-method { font-family: var(--font-body); font-size: 0.52rem; letter-spacing: 0.06em; color: var(--accent-dim); opacity: 0.75; line-height: 1.7; text-align: center; margin-top: 0.9rem; }

    .race-empty { text-align: center; font-family: var(--font-body); font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-dim); padding: 2.5rem 1rem; }
    .race-footer { position: relative; z-index: 20; text-align: center; font-family: var(--font-body); font-size: 0.55rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent-dim); opacity: 0.5; padding: 1.5rem 2rem 3rem; }

    @media (max-width: 600px) {
      .race-hero { padding: 4.5rem 1.2rem 1rem; }
      .race-wrap { padding: 0 1rem; }
      .race-row { padding: 0.7rem 0.7rem 0.65rem; }
      .race-row-top { grid-template-columns: 1.1rem 38px 1fr auto; gap: 0.55rem; }
      .race-logo, .race-logo-init { width: 38px; height: 38px; }
      .race-team-name { font-size: 0.95rem; }
      .race-odds-num { font-size: 1.6rem; }
      .race-gotw-side img, .race-gotw-side .race-logo-init { width: 58px; height: 58px; }
      .race-pick { padding: 0.5rem 0.45rem; --logo: 26px; }
      .race-pick-main { gap: 0.4rem; }
      .race-game-mid { padding-top: calc(0.5rem + 1px); }
      .race-game-mid .vs { height: 26px; }
      .race-spot-fans { gap: 0 0.5rem; }
      .race-spot-col { padding: 0.5rem 0.35rem 0.4rem; }
      .race-fans-key { gap: 0.8rem; font-size: 0.42rem; letter-spacing: 0.1em; white-space: nowrap; }
      .race-pick-name { font-size: 0.78rem; }
    }
  </style>
