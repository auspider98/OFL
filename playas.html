        (o.hi ? '<div class="pv-fact"><span>Career-high week</span><b>' + o.hi.score.toFixed(2) + ' (' + o.hi.year + ' Wk ' + o.hi.week + ')</b></div>' : '') +
        (o.best ? '<div class="pv-fact"><span>Best season</span><b>' + o.best.w + '-' + o.best.l + ' (' + o.best.year + ')</b></div>' : '') +
        '<div class="pv-fact"><span>Avg points / season</span><b>' + (o.rows.length ? (o.pf / o.rows.length).toFixed(1) : '0') + '</b></div>';
      } else if (backTab === 'BRC') {
        html += '<table class="pv-table"><thead><tr><th>Yr</th><th>Bracket</th><th>Pts</th><th>Fin</th><th></th></tr></thead><tbody>' +
          b.rows.map(function (r) {
            return '<tr class="' + (r.champ ? 'champ' : '') + '"><td>' + esc(String(r.year).slice(2)) + '</td><td>' + esc(r.team) + '</td><td>' + (r.pts ? r.pts.toFixed(0) : '\u2014') + '</td><td>' + ordinal(r.rank) + '/' + r.of + '</td><td class="pv-res">' + (r.champ ? '&#x2605;' : '') + '</td></tr>';
          }).join('') +
          '<tr class="total"><td>Car</td><td>' + b.rows.length + ' brackets</td><td colspan="3">Avg finish ' + (b.rows.length ? (b.finSum / b.rows.length).toFixed(1) : '\u2014') + '</td></tr>' +
        '</tbody></table>' +
        (rk && b.rows.length ? (function (r0) {
          return '<div class="pv-sec">Rookie Season</div><div class="pv-fact rookie"><span>' + esc(r0.year) + ' &middot; ' + esc(r0.team) + '</span><b>' +
            (r0.pts ? r0.pts.toFixed(0) + ' pts, ' : '') + ordinal(r0.rank) + ' of ' + r0.of + '</b></div>';
        })(b.rows[b.rows.length - 1]) : '') +
        '<div class="pv-sec">Career Highlights</div>' +
        '<div class="pv-fact"><span>Titles</span><b>' + b.titles + '</b></div>' +
        (b.best ? '<div class="pv-fact"><span>Best finish</span><b>' + ordinal(b.best.rank) + ' (' + b.best.year + ')</b></div>' : '') +
        (b.ptsBest && b.ptsBest.pts ? '<div class="pv-fact"><span>Best bracket score</span><b>' + b.ptsBest.pts.toFixed(0) + ' (' + b.ptsBest.year + ')</b></div>' : '');
      } else {
        html += '<p class="pv-empty">No seasons on record yet. Rookie card.</p>';
      }

      if (vt) {
        html += '<div class="pv-sec">Service Stripes</div><div class="pv-stripes">' +
          vt.per.map(function (x, i) { return new Array(x.n + 1).join('<i class="s' + (i % 2) + '"></i>'); }).join('') + '</div>' +
          '<div class="pv-stripes-key">' + vt.per.map(function (x, i) { return '<span class="s' + (i % 2) + '"></span>' + esc(x.key) + ' ' + x.n; }).join(' &nbsp; ') +
          ' &nbsp;= ' + vt.total + ' seasons</div>';
      }
      if (!hf.inducted && hf.pct > 0) {
        var hp = Math.min(99, Math.floor(hf.pct * 100));
        html += '<div class="pv-sec">Hall of Fame Watch</div><div class="pv-watch"><div class="pv-watch-bar"><i style="width:' + hp + '%"></i></div><b>' + hp + '%</b></div>' +
          '<div class="pv-watch-path">Closest: ' + esc(hf.bestPath) + '</div>';
      }
      if (awards.length) {
        html += '<div class="pv-sec">Trophy Case (' + awards.length + ')</div><div class="pv-awards">' +
          awards.slice(0, 12).map(function (a) { return '<span class="pv-award">' + esc(a.awardName) + ' <i>' + esc(String(a.year).slice(2)) + '</i></span>'; }).join('') +
          (awards.length > 12 ? '<span class="pv-award"><i>+' + (awards.length - 12) + ' more</i></span>' : '') + '</div>';
      }
      var hasOFC = (m.leagues || []).some(function (l) { return l.leagueKey === 'OFC'; });
      html += '<div class="pv-foot"><span class="pv-foot-links"><a href="playa.html?id=' + encodeURIComponent(m.id) + '">Profile &#x2197;</a>' +
        (hasOFC ? '<a href="team.html?id=' + encodeURIComponent(m.id) + '">Team Page &#x2197;</a>' : '') + '</span><span>Tap to flip</span></div>';
      return html + '<div class="pv-holo"></div></div>' + (hf.inducted ? hofGlimmer(26) : '') + '</div>';
    }

    /* Retired members: the card is sealed in a clear collector's case with a label */
    function slabLabel(m, leagueData, tier) {
      var ys = [];
      (leagueData || []).forEach(function (l) { (l.seasons || []).forEach(function (s) { if (s.isFinal && seasonHas(s, m.id)) ys.push(parseInt(s.year, 10) || 0); }); });
      ys = ys.filter(Boolean);
      var span = ys.length ? Math.min.apply(null, ys) + (Math.max.apply(null, ys) > Math.min.apply(null, ys) ? '&ndash;' + Math.max.apply(null, ys) : '') : '';
      var t = getChampionships(m.id, leagueData).length, n = countSeasons(m.id, leagueData);
      return '<div class="pv-slab-case" aria-hidden="true"></div>' +
        '<div class="pv-slab-label' + (tier.key === 'hof' ? ' is-gold' : '') + '">' +
          '<div class="pv-slab-l"><span>OFL &middot; Retired' + (tier.key === 'hof' ? ' &middot; Hall of Fame' : '') + '</span><b>' + esc(m.name || '') + '</b><span>' + span + '</span></div>' +
          '<div class="pv-slab-r"><b>' + n + '</b><span>Seasons</span><b>' + t + '</b><span>' + (t === 1 ? 'Title' : 'Titles') + '</span></div>' +
        '</div>';
    }

    function buildViewer() {
      if (document.getElementById('pvOverlay')) return;
      var ov = document.createElement('div');
      ov.className = 'pv-overlay'; ov.id = 'pvOverlay';
      ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', 'Playa card');
      ov.innerHTML =
        '<div class="pv-stage">' +
          '<div class="pv-row">' +
            '<button class="pv-nav" id="pvPrev" aria-label="Previous card">&#x2039;</button>' +
            '<div class="pv-card" id="pvCard"><div class="pv-tilt"><div class="pv-flip" id="pvFlip"></div></div></div>' +
            '<button class="pv-nav" id="pvNext" aria-label="Next card">&#x203A;</button>' +
          '</div>' +
          '<div class="pv-controls"><button class="pv-btn" id="pvFlipBtn">Flip &#x21BB;</button><span class="pv-count" id="pvCount"></span><a class="pv-btn" id="pvProfile" href="playa.html">Profile &#x2197;</a><button class="pv-btn pv-help" id="pvGuide" aria-label="Card Guide" title="Card Guide">?</button><button class="pv-btn" id="pvClose">Close &#x2715;</button></div>' +
        '</div>';
      document.body.appendChild(ov);

      var card = document.getElementById('pvCard');
      ov.addEventListener('click', function (e) { if (e.target === ov || e.target.classList.contains('pv-stage')) closeViewer(); });
      document.getElementById('pvClose').onclick = closeViewer;
      document.getElementById('pvGuide').onclick = function () {   // opens on this card's type
        var data = window.OFL_DATA || {}, t = cardTier(VIEW_LIST[viewIdx], data.leagueData || []);
        openGuide(t.retired ? 'retired' : t.key);
      };
      document.getElementById('pvPrev').onclick = function () { stepViewer(-1); };
      document.getElementById('pvNext').onclick = function () { stepViewer(1); };
      document.getElementById('pvFlipBtn').onclick = function () { card.classList.toggle('flipped'); };
      card.addEventListener('click', function (e) {
        if (e.target.closest('a')) return;
        var tab = e.target.closest('.pv-tab');
        if (tab) { backTab = tab.getAttribute('data-tab'); renderViewer(true); return; }
        if (e.target.closest('.pv-back-inner') && card.classList.contains('flipped') && moved) return;
        if (!swiped) card.classList.toggle('flipped');
      });

      // Tilt + holo: pointer on desktop, device tilt on phones
      function setTilt(px, py) {
        card.style.setProperty('--mx', px.toFixed(1)); card.style.setProperty('--my', py.toFixed(1));
        card.style.setProperty('--ry', ((px - 50) * 0.24).toFixed(2) + 'deg');
        card.style.setProperty('--rx', ((50 - py) * 0.2).toFixed(2) + 'deg');
      }
      card.addEventListener('pointermove', function (e) {
        if (e.pointerType === 'touch') return;
        var r = card.getBoundingClientRect();
        setTilt((e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100);
      });
      card.addEventListener('pointerleave', function () { setTilt(50, 50); });
      window.addEventListener('deviceorientation', function (e) {
        if (!ov.classList.contains('open') || e.gamma == null) return;
        var gx = Math.max(-30, Math.min(30, e.gamma)), by = Math.max(10, Math.min(70, e.beta || 40));
        setTilt(50 + gx / 30 * 50, (by - 10) / 60 * 100);
      });

      // Swipe left/right to change cards
      var sx = 0, sy = 0, swiped = false, moved = false;
      card.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiped = false; moved = false; }, { passive: true });
      card.addEventListener('touchmove', function (e) {
        var dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
        if (Math.abs(dy) > 8) moved = true;
        var r = card.getBoundingClientRect();
        setTilt(50 + Math.max(-50, Math.min(50, dx / r.width * 100)), 50 + Math.max(-50, Math.min(50, dy / r.height * 100)));
      }, { passive: true });
      card.addEventListener('touchend', function (e) {
        var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
        setTilt(50, 50);
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { swiped = true; stepViewer(dx < 0 ? 1 : -1); setTimeout(function () { swiped = false; }, 300); }
      });
      document.addEventListener('keydown', function (e) {
        if (!ov.classList.contains('open') || guideIsOpen()) return;
        if (e.key === 'Escape') closeViewer();
        else if (e.key === 'ArrowLeft') stepViewer(-1);
        else if (e.key === 'ArrowRight') stepViewer(1);
        else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); card.classList.toggle('flipped'); }
      });
    }

    function renderViewer(keepFlip) {
      var data = window.OFL_DATA || {}, leagueData = data.leagueData || [];
      var m = (data.masterRoster || []).find(function (x) { return x.id === VIEW_LIST[viewIdx]; });
      if (!m) return;
      var tier = cardTier(m.id, leagueData);
      var card = document.getElementById('pvCard');
      card.className = 'pv-card ' + tier.cls + (keepFlip && card.classList.contains('flipped') ? ' flipped' : '');
      var scroll = keepFlip ? (card.querySelector('.pv-back-inner') || {}).scrollTop : 0;
      document.getElementById('pvFlip').innerHTML = cardFront(m, leagueData, tier) + cardBack(m, leagueData);
      var tiltEl = card.querySelector('.pv-tilt');
      Array.prototype.forEach.call(tiltEl.querySelectorAll('.pv-slab-case, .pv-slab-label'), function (el) { el.remove(); });
      if (tier.retired) tiltEl.insertAdjacentHTML('beforeend', slabLabel(m, leagueData, tier));
      if (keepFlip && scroll) card.querySelector('.pv-back-inner').scrollTop = scroll;
      document.getElementById('pvCount').textContent = (viewIdx + 1) + ' / ' + VIEW_LIST.length;
      document.getElementById('pvProfile').href = 'playa.html?id=' + encodeURIComponent(m.id);
      document.getElementById('pvPrev').disabled = viewIdx <= 0;
      document.getElementById('pvNext').disabled = viewIdx >= VIEW_LIST.length - 1;
    }
    function openViewer(id) {
      buildViewer();
      viewIdx = Math.max(0, VIEW_LIST.indexOf(id));
      if (VIEW_LIST.indexOf(id) === -1) { VIEW_LIST = [id]; viewIdx = 0; }
      backTab = null;
      renderViewer(false);
      var ov = document.getElementById('pvOverlay');
      ov.classList.add('open');
      document.body.classList.add('no-scroll');
      if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try { DeviceOrientationEvent.requestPermission().catch(function () {}); } catch (e) {}
      }
    }
    function stepViewer(d) {
      var n = viewIdx + d;
      if (n < 0 || n >= VIEW_LIST.length) return;
      viewIdx = n; backTab = null; renderViewer(false);
    }
    function closeViewer() {
      var ov = document.getElementById('pvOverlay');
      if (ov) ov.classList.remove('open');
      document.body.classList.remove('no-scroll');
    }

    // ── Sort ──
    function mostRecentSeasonYear(memberId, leagueData) {
      var best = 0;
      (leagueData || []).forEach(function (league) {
        (league.seasons || []).forEach(function (season) {
          var inRoster    = (season.roster    || []).some(function (r) { return r.memberId === memberId; });
          var inStandings = (season.standings || []).some(function (r) { return r.memberId === memberId; });
          if (inRoster || inStandings) best = Math.max(best, parseInt(season.year, 10) || 0);
        });
      });
      return best;
    }

    function mostRecentAwardYear(memberId, leagueData) {
      var awards = getAwardsWon(memberId, leagueData); // already sorted desc
      return awards.length ? (parseInt(awards[0].year, 10) || 0) : 0;
    }

    function sortMembers(members, leagueData, mode) {
      return members.slice().sort(function (a, b) {
        if (mode === 'titles') {
          var aC = getChampionships(a.id, leagueData);
          var bC = getChampionships(b.id, leagueData);
          if (bC.length !== aC.length) return bC.length - aC.length;
          var aYear = aC.length ? (parseInt(aC[0].year, 10) || 0) : 0;
          var bYear = bC.length ? (parseInt(bC[0].year, 10) || 0) : 0;
          if (bYear !== aYear) return bYear - aYear;
          return (a.name || '').localeCompare(b.name || '');
        }
        if (mode === 'awards') {
          var aA = getAwardsWon(a.id, leagueData).length;
          var bA = getAwardsWon(b.id, leagueData).length;
          if (bA !== aA) return bA - aA;
          var aAY = mostRecentAwardYear(a.id, leagueData);
          var bAY = mostRecentAwardYear(b.id, leagueData);
          if (bAY !== aAY) return bAY - aAY;
          return (a.name || '').localeCompare(b.name || '');
        }
        if (mode === 'seasons') {
          var aS = countSeasons(a.id, leagueData);
          var bS = countSeasons(b.id, leagueData);
          if (bS !== aS) return bS - aS;
          var aSY = mostRecentSeasonYear(a.id, leagueData);
          var bSY = mostRecentSeasonYear(b.id, leagueData);
          if (bSY !== aSY) return bSY - aSY;
          return (a.name || '').localeCompare(b.name || '');
        }
        // A-Z
        return (a.name || '').localeCompare(b.name || '');
      });
    }

    // ── Render body ──
    function renderBody(config, data) {
      var body    = document.getElementById('playasBody');
      var roster  = data.masterRoster || [];
      var leagues = data.leagueData   || [];

      if (!roster.length) {
        body.innerHTML = '<div class="playas-section"><p class="playas-empty">No members in the roster yet.</p></div>';
        return;
      }

      // Build section container
      var sec = document.createElement('div');
      sec.className = 'playas-section section-reveal';
      sec.style.animationDelay = '0.5s';

      // ── Controls ──
      var controlsRow = document.createElement('div');
      controlsRow.className = 'playas-controls';
      controlsRow.innerHTML =
        // Line 1: filter pills centered
        '<div class="playas-filter-pills">' +
          '<button class="playas-filter-pill is-active" data-filter="career">Active</button>' +
          '<button class="playas-filter-pill" data-filter="hof">Hall of Fame</button>' +
          '<button class="playas-filter-pill" data-filter="ofc">OFC</button>' +
          '<button class="playas-filter-pill" data-filter="brc">BRC</button>' +
          '<button class="playas-filter-pill" data-filter="rookies">Rookies</button>' +
          '<button class="playas-filter-pill" data-filter="veterans">Old Skool</button>' +
          '<button class="playas-filter-pill" data-filter="retired">Retired</button>' +
        '</div>' +
        // Line 2: view dropdown left, heading right
        '<div class="playas-controls-row2">' +
          '<div class="playas-view-group">' +
            '<label class="playas-control-label" for="playasSort">View</label>' +
            '<select class="playas-select" id="playasSort">' +
              '<option value="az">A–Z</option>' +
              '<option value="seasons">Seasons</option>' +
              '<option value="titles">Titles</option>' +
            '</select>' +
          '</div>' +
          '<div class="playas-heading-group">' +
            '<span class="playas-heading-text">Active Roster</span>' +
            '<span class="playas-heading-count"></span>' +
          '</div>' +
          '<button class="playas-guide-btn" id="playasGuideBtn" aria-label="Open the Card Guide">Card Guide <i>?</i></button>' +
        '</div>';
      sec.appendChild(controlsRow);

      // ── Grid container ──
      var gridWrap = document.createElement('div');
      gridWrap.id = 'playasGridWrap';
      sec.appendChild(gridWrap);

      body.appendChild(sec);

      // ── Footer ──
      var footer = document.createElement('div');
      footer.className = 'playas-footer section-reveal';
      footer.id = 'playasFooter';
      if (config.footer && config.footer.show) {
        footer.textContent = config.footer.text;
      } else {
        footer.style.display = 'none';
      }
      body.appendChild(footer);

      // ── Render grid based on current filter + sort ──
      var activeFilter = 'career';

      function applyFilterSort() {
        var filterVal = activeFilter;
        var sortVal   = document.getElementById('playasSort').value;
        var wrap      = document.getElementById('playasGridWrap');
        var heading   = controlsRow.querySelector('.playas-heading-text');
        var countEl   = controlsRow.querySelector('.playas-heading-count');

        wrap.innerHTML = '';

        // Determine member set based on filter
        var active   = roster.filter(function (m) { return m.active !== false && m.active !== 'false'; });
        var inactive = roster.filter(function (m) { return m.active === false || m.active === 'false'; });

        function inLeague(member, key) {
          return (member.leagues || []).some(function (lg) {
            return (lg.leagueKey || '').toUpperCase() === key.toUpperCase();
          });
        }

        var members;
        if (filterVal === 'career') {
          heading.textContent = 'Active';
          members = active.slice();
        } else if (filterVal === 'ofc') {
          heading.textContent = 'OFC';
          members = roster.filter(function (m) { return inLeague(m, 'OFC'); });
        } else if (filterVal === 'brc') {
          heading.textContent = 'BRC';
          members = roster.filter(function (m) { return inLeague(m, 'BRC'); });
        } else if (filterVal === 'veterans') {
          heading.textContent = 'Old Skool';
          members = roster.filter(function (m) { return !!cardTier(m.id, leagues).vet; });
        } else if (filterVal === 'rookies') {
          heading.textContent = 'Rookies';
          members = roster.filter(function (m) { return !!rookieInfo(m.id, leagues); });
        } else if (filterVal === 'hof') {
          heading.textContent = 'Hall of Fame';
          members = roster.filter(function (m) { return hofInfo(m.id, leagues).inducted; })
            .sort(function (a, b) { return hofInfo(a.id, leagues).no - hofInfo(b.id, leagues).no; });
        } else if (filterVal === 'retired') {
          heading.textContent = 'Retired';
          members = inactive.slice();
        } else {
          members = roster.slice();
        }

        var sorted = filterVal === 'hof' && sortVal === 'az' ? members : sortMembers(members, leagues, sortVal);   // Hall of Fame: inductee order
        VIEW_LIST = sorted.map(function (m) { return m.id; });
        countEl.textContent = '— ' + sorted.length + ' Member' + (sorted.length !== 1 ? 's' : '');

        if (sorted.length) {
          var flatGrid = document.createElement('div');
          flatGrid.className = 'playas-grid';
          sorted.forEach(function (m, i) {
            flatGrid.appendChild(buildPlayaCard(m, leagues, 0.1 * i));
          });
          wrap.appendChild(flatGrid);
        } else {
          wrap.innerHTML = filterVal === 'hof'
            ? '<p class="playas-empty">No one has been inducted yet. The first Hall of Famer will be unveiled here.</p>'
            : '<p class="playas-empty">No members match this filter.</p>';
        }

        // Update footer delay
        var footerEl = document.getElementById('playasFooter');
        if (footerEl) footerEl.style.animationDelay = '0.5s';
      }

      // ── Filter pill clicks ──
      controlsRow.querySelectorAll('.playas-filter-pill').forEach(function (pill) {
        pill.addEventListener('click', function () {
          activeFilter = pill.getAttribute('data-filter');
          controlsRow.querySelectorAll('.playas-filter-pill').forEach(function (p) {
            p.classList.toggle('is-active', p === pill);
          });
          applyFilterSort();
        });
      });

      document.getElementById('playasSort').addEventListener('change', applyFilterSort);
      document.getElementById('playasGuideBtn').addEventListener('click', function () { openGuide('rookie'); });
      GUIDE_FILTER = function (f) {   // "See them all" in the guide jumps to that filter
        var pill = controlsRow.querySelector('.playas-filter-pill[data-filter="' + f + '"]');
        if (pill) pill.click();
      };

      applyFilterSort();
    }

    function initPlayasSlideshow(config) {
      var overlayEl = document.getElementById('playasOverlay');
      if (overlayEl && config.slideshow && config.slideshow.overlay) {
        overlayEl.style.background = config.slideshow.overlay;
      }
    }

    function init() {
      var config = window.SITE_CONFIG;
      var data   = window.OFL_DATA;
      if (!config) { console.warn('SITE_CONFIG not found'); return; }
      if (!data)   { console.warn('OFL_DATA not found'); return; }
      document.title = 'OFL \u2014 The Playas';
      initPlayasSlideshow(config);
      renderBody(config, data);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  })();
  </script>

</body>
