<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OFL — Team</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="admin-config.js"></script>
  <script src="ofl-data.js"></script>
  <script src="admin.js"></script>
  <script src="ofl-engine.js"></script>
  <script src="ofl-phrasebook.js"></script>
  <script src="ofl-newsroom.js"></script>

  <style>
    /* ══════════════════════════════════════════════════════════
       TEAM PAGE LAYOUT
    ══════════════════════════════════════════════════════════ */
    .team-page {
      position: relative; width: 100%; min-height: 100vh;
      display: flex; flex-direction: column; overflow-x: hidden;
    }
    .team-page > .slide-layer      { position: fixed; inset: 0; z-index: 0; height: 100%; }
    .team-page > .landing-overlay  { position: fixed; inset: 0; z-index: 10; height: 100%; pointer-events: none; }
    .team-page > .landing-vignette { position: fixed; inset: 0; z-index: 11; height: 100%; pointer-events: none; }

    /* ══════════════════════════════════════════════════════════
       HERO
    ══════════════════════════════════════════════════════════ */
    .team-hero {
      position: relative; z-index: 20; width: 100%;
      min-height: calc(42vh - 10px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding: 5rem 2rem 0;
    }
    .team-hero .landing-rule { position: absolute; bottom: 0; left: 0; right: 0; z-index: 10; }

    .team-hero-inner {
      position: relative; z-index: 13;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; width: 100%; max-width: 700px;
      padding-bottom: 2.5rem;
    }

    /* Logo */
    .team-hero-logo-wrap {
      width: 300px; height: 300px; margin-bottom: 1.4rem;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; animation: heroReveal 1s 0.1s ease forwards;
    }
    .team-hero-logo-wrap img {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.6));
    }
    .team-hero-logo-placeholder {
      width: 300px; height: 300px;
      border: 1px solid var(--drawer-border);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-size: 2.2rem;
      color: var(--accent-dim); opacity: 0.4;
    }

    /* Owner back-link */
    .team-hero-owner {
      font-family: var(--font-body); font-weight: 300;
      font-size: var(--size-eyebrow, 8pt); letter-spacing: 0.45em;
      text-transform: uppercase; color: var(--accent-dim);
      margin-bottom: 0.8rem;
      opacity: 0; animation: heroReveal 1.2s 0.2s ease forwards;
    }
    .team-hero-owner a {
      color: inherit; text-decoration: none;
      transition: color 0.25s;
    }
    .team-hero-owner a:hover { color: var(--team-primary, var(--accent)); }

    /* Team name */
    .team-hero-name {
      font-family: var(--font-display); font-weight: 300;
      font-size: var(--size-title, 72pt); line-height: 0.92;
      letter-spacing: -0.02em; color: var(--accent); margin-bottom: 1rem;
      opacity: 0; animation: heroReveal 1.2s 0.35s ease forwards;
    }

    /* Color bar under name */
    .team-hero-color-bar {
      display: flex; gap: 0.4rem; margin-bottom: 1rem; justify-content: center;
      opacity: 0; animation: heroReveal 1s 0.5s ease forwards;
    }
    .team-hero-color-swatch {
      width: 28px; height: 4px; border-radius: 2px;
    }

    /* Status + seasons pill row */
    .team-hero-meta {
      display: flex; gap: 0.6rem; align-items: center; justify-content: center;
      flex-wrap: wrap;
      opacity: 0; animation: heroReveal 1.2s 0.55s ease forwards;
    }
    .team-hero-pill {
      font-family: var(--font-body); font-size: 0.48rem;
      letter-spacing: 0.25em; text-transform: uppercase;
      border: 1px solid var(--drawer-border);
      padding: 0.22rem 0.6rem; color: var(--accent); font-weight: 700;
    }
    a.team-hero-pill-link { text-decoration: none; transition: border-color 0.2s, color 0.2s; }
    a.team-hero-pill-link:hover { border-color: var(--team-primary, var(--accent-dim)); color: var(--team-primary, var(--accent)); }
    .team-hero-pill.active {
      color: var(--team-primary, var(--hint-color, var(--accent-dim)));
      border-color: var(--team-primary, var(--hint-color, var(--drawer-border)));
    }

    .team-power-tier {
      font-family: var(--font-body);
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      border: 1px solid;
      border-radius: 3px;
      padding: 0.2rem 1.2rem;
      margin-top: 0.4rem;
      display: inline-block;
      opacity: 0.9;
    }

    /* ══════════════════════════════════════════════════════════
       BODY
    ══════════════════════════════════════════════════════════ */
    .team-body { position: relative; z-index: 20; flex: 1; padding: 0 0 6rem; }
    .team-wrap { max-width: 1060px; margin: 0 auto; padding: 2rem 2rem 0; }

    /* ── Section heading ──────────────────────────────────── */
    .team-section-heading {
      font-family: var(--font-body); font-weight: var(--weight-section-heading, 300);
      font-size: var(--size-section-heading, 7pt); letter-spacing: 0.4em;
      text-transform: uppercase; color: var(--hint-color, var(--accent-dim));
      margin-bottom: 1.2rem; padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--drawer-border);
    }

    /* ══════════════════════════════════════════════════════════
       CAREER OVERVIEW STRIP
    ══════════════════════════════════════════════════════════ */
    .team-career-strip {
      display: flex; flex-wrap: wrap; gap: 0;
      border: 1px solid var(--drawer-border);
      margin-bottom: 2.5rem;
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(4px);
    }
    .team-career-stat {
      flex: 1 1 100px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 1.4rem 1rem; text-align: center;
      border-right: 1px solid var(--drawer-border);
    }
    .team-career-stat:last-child { border-right: none; }
    .team-career-stat {
      transition: background 0.2s, transform 0.2s;
    }
    .team-career-stat:hover {
      background: rgba(255,255,255,0.04);
      transform: translateY(-2px);
    }
    .team-career-stat-value {
      font-family: var(--font-display); font-weight: 300;
      font-size: 2.6rem; line-height: 1; color: var(--accent);
      margin-bottom: 0.35rem;
    }
    .team-career-stat-value.accent {
      color: var(--team-primary, var(--hint-color, var(--accent)));
    }
    .team-career-stat-label {
      font-family: var(--font-body); font-size: 0.46rem;
      letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent-dim);
    }


    /* ══════════════════════════════════════════════════════════
       THIS SEASON — live war room (classes prefixed tsn-)
       Shows only while the OFC season is in progress.
    ══════════════════════════════════════════════════════════ */
    .tsn { position: relative; border: 1px solid var(--drawer-border); background: rgba(8,8,8,0.72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); margin-bottom: 2.5rem; overflow: hidden; }
    .tsn::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--team-primary, var(--accent)); }
    .tsn::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 0% 0%, var(--team-primary, transparent), transparent 55%); opacity: 0.16; }
    .tsn > * { position: relative; z-index: 1; }
    .tsn-head { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; flex-wrap: wrap; padding: 1rem 1.3rem 0.8rem; border-bottom: 1px solid var(--drawer-border); }
    .tsn-kicker { font-family: var(--font-body); font-size: 0.5rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--accent-dim); }
    .tsn-title { font-family: var(--font-display); font-size: 1.6rem; line-height: 1.05; color: var(--accent); margin-top: 0.2rem; }
    .tsn-status { font-family: var(--font-body); font-size: 0.55rem; letter-spacing: 0.25em; text-transform: uppercase; padding: 0.35rem 0.8rem; border: 1px solid currentColor; font-weight: 700; white-space: nowrap; }
    .tsn-grid { display: grid; grid-template-columns: 1.35fr 1fr; }
    .tsn-col { padding: 1.1rem 1.3rem 1.3rem; min-width: 0; }
    .tsn-col + .tsn-col { border-left: 1px solid var(--drawer-border); }
    .tsn-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1px solid var(--drawer-border); margin-bottom: 1.1rem; }
    .tsn-tile { padding: 0.75rem 0.4rem 0.65rem; text-align: center; border-right: 1px solid var(--drawer-border); }
    .tsn-tile:last-child { border-right: none; }
    .tsn-tile-v { font-family: var(--font-display); font-size: 1.7rem; line-height: 1; color: var(--accent); }
    .tsn-tile-v.is-team { color: var(--team-primary, var(--accent)); filter: brightness(1.35); }
    .tsn-tile-l { font-family: var(--font-body); font-size: 0.44rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent-dim); margin-top: 0.35rem; }
    .tsn-tile-s { font-family: var(--font-body); font-size: 0.5rem; letter-spacing: 0.08em; color: var(--accent-dim); margin-top: 0.15rem; }
    .tsn-spark { display: block; width: 100%; height: 22px; margin-top: 0.3rem; }
    .tsn-spark polyline { fill: none; stroke: var(--team-primary, var(--accent)); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; filter: brightness(1.4); }
    .tsn-sub { font-family: var(--font-body); font-size: 0.48rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--accent-dim); margin: 0 0 0.6rem; display: flex; justify-content: space-between; gap: 0.5rem; }
    .tsn-sub span:last-child { letter-spacing: 0.12em; opacity: 0.7; }
    .tsn-chart { display: block; width: 100%; height: auto; overflow: visible; }
    .tsn-chart .b-w { fill: var(--team-primary, #e8e8e8); }
    .tsn-chart .b-l { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.4); stroke-width: 1; }
    .tsn-chart .b-f { fill: none; stroke: rgba(255,255,255,0.18); stroke-width: 1; stroke-dasharray: 3 3; }
    .tsn-chart .avg { fill: none; stroke: rgba(255,255,255,0.75); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .tsn-chart text { font-family: var(--font-body); font-size: 9px; fill: rgba(232,232,232,0.6); letter-spacing: 0.06em; }
    .tsn-chart .sc { font-size: 8.5px; fill: rgba(232,232,232,0.9); }
    .tsn-chart .bar { cursor: default; transition: opacity 0.2s; }
    .tsn-chart .bar:hover { opacity: 0.75; }
    .tsn-legend { display: flex; gap: 1rem; flex-wrap: wrap; font-family: var(--font-body); font-size: 0.5rem; letter-spacing: 0.12em; color: var(--accent-dim); margin-top: 0.5rem; }
    .tsn-legend i { display: inline-block; width: 10px; height: 10px; vertical-align: -1px; margin-right: 0.35rem; }
    .tsn-legend .k-w { background: var(--team-primary, #e8e8e8); }
    .tsn-legend .k-l { border: 1px solid rgba(255,255,255,0.4); }
    .tsn-legend .k-a { height: 0; border-top: 2px dashed rgba(255,255,255,0.75); width: 14px; vertical-align: 3px; }

    .tsn-next { border: 1px solid var(--drawer-border); padding: 0.9rem; margin-bottom: 1.1rem; background: rgba(0,0,0,0.3); }
    .tsn-vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0.5rem; text-align: center; }
    .tsn-side img, .tsn-side .tsn-init { width: 56px; height: 56px; object-fit: contain; display: block; margin: 0 auto 0.35rem; }
    .tsn-side .tsn-init { display: flex; align-items: center; justify-content: center; border: 1px solid var(--drawer-border); font-family: var(--font-display); color: var(--accent-dim); }
    .tsn-side-n { font-family: var(--font-display); font-size: 1.02rem; line-height: 1.1; color: var(--accent); }
    .tsn-side-r { font-family: var(--font-body); font-size: 0.5rem; letter-spacing: 0.15em; color: var(--accent-dim); margin-top: 0.15rem; }
    .tsn-side-p { font-family: var(--font-display); font-size: 1.35rem; color: var(--accent); margin-top: 0.3rem; }
    .tsn-at { font-family: var(--font-body); font-size: 0.55rem; letter-spacing: 0.25em; color: var(--accent-dim); }
    .tsn-wp { margin: 0.8rem 0 0.2rem; }
    .tsn-wp-bar { display: flex; height: 8px; border: 1px solid var(--drawer-border); }
    .tsn-wp-bar i { display: block; height: 100%; }
    .tsn-wp-bar .me { background: var(--team-primary, #e8e8e8); }
    .tsn-wp-bar .op { background: var(--oc, #555); opacity: 0.7; }
    .tsn-wp-lab { display: flex; justify-content: space-between; font-family: var(--font-body); font-size: 0.55rem; letter-spacing: 0.12em; color: var(--accent); margin-top: 0.3rem; font-weight: 700; }
    .tsn-swing { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.8rem; }
    .tsn-swing div { border: 1px solid var(--drawer-border); padding: 0.45rem; text-align: center; }
    .tsn-swing b { display: block; font-family: var(--font-display); font-size: 1.4rem; font-weight: 400; line-height: 1; }
    .tsn-swing span { font-family: var(--font-body); font-size: 0.44rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent-dim); }
    .tsn-swing .up b { color: #4caf7d; } .tsn-swing .dn b { color: #d94f4f; }
    .tsn-note { font-family: var(--font-body); font-size: 0.62rem; line-height: 1.5; letter-spacing: 0.03em; color: var(--accent-dim); margin-top: 0.7rem; }
    .tsn-note b { color: var(--accent); font-weight: 700; }

    .tsn-path { display: flex; gap: 4px; margin-bottom: 0.5rem; }
    .tsn-path div { flex: 1; min-width: 0; border: 1px solid var(--drawer-border); text-align: center; padding: 0.4rem 0 0.35rem; position: relative; overflow: hidden; }
    .tsn-path div::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: var(--h); background: var(--team-primary, #e8e8e8); opacity: 0.28; }
    .tsn-path div.is-mark { border-color: var(--team-primary, var(--accent)); }
    .tsn-path b { position: relative; display: block; font-family: var(--font-display); font-size: 0.95rem; font-weight: 400; color: var(--accent); }
    .tsn-path span { position: relative; display: block; font-family: var(--font-body); font-size: 0.42rem; letter-spacing: 0.12em; color: var(--accent-dim); margin-top: 0.1rem; }
    .tsn-news { display: block; border-top: 1px solid var(--drawer-border); margin-top: 1rem; padding-top: 0.8rem; text-decoration: none; }
    .tsn-news-k { font-family: var(--font-body); font-size: 0.46rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent-dim); }
    .tsn-news-h { font-family: var(--font-display); font-size: 1.15rem; line-height: 1.15; color: var(--accent); margin-top: 0.25rem; }
    .tsn-news:hover .tsn-news-h { text-decoration: underline; text-underline-offset: 3px; }
    .tsn-links { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    .tsn-links a { font-family: var(--font-body); font-size: 0.5rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); text-decoration: none; border: 1px solid var(--drawer-border); padding: 0.45rem 0.75rem; transition: border-color 0.2s; }
    .tsn-links a:hover { border-color: var(--team-primary, var(--accent)); }
    .tsn-wait { padding: 2rem; text-align: center; font-family: var(--font-body); font-size: 0.55rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent-dim); }
    .ofl-lc { text-transform: lowercase !important; }
    @media (max-width: 760px) {
      .tsn-grid { grid-template-columns: 1fr; }
      .tsn-col + .tsn-col { border-left: none; border-top: 1px solid var(--drawer-border); }
      .tsn-col { padding: 1rem; }
      .tsn-head { padding: 0.9rem 1rem 0.7rem; }
      .tsn-tile-v { font-size: 1.4rem; }
    }


    /* ── Season Log → Wrapped ─────────────────────────────── */
    .team-section-heading-split { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
    .team-wr-hint { font-size: 0.85em; letter-spacing: 0.18em; opacity: 0.55; white-space: nowrap; }
    .team-table .team-wr-go { width: 1.6rem; padding-left: 0; padding-right: 0.6rem; text-align: right; font-size: 0.55rem; color: var(--team-primary, var(--accent)); opacity: 0; transition: opacity 0.2s; }
    .team-table tr.team-wr-row { cursor: pointer; transition: background 0.2s; }
    .team-table tr.team-wr-row:hover, .team-table tr.team-wr-row:focus-visible { background: color-mix(in srgb, var(--team-primary, #ffffff) 14%, transparent); outline: none; }
    .team-table tr.team-wr-row:hover .team-wr-go, .team-table tr.team-wr-row:focus-visible .team-wr-go { opacity: 1; }
    @media (hover: none) { .team-table tr.team-wr-row .team-wr-go { opacity: 0.6; } }
    .team-wr-pop { position: fixed; inset: 0; z-index: 10000; background: #000; opacity: 0; transition: opacity 0.25s ease; }
    .team-wr-pop.is-on { opacity: 1; }
    .team-wr-pop iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
    body.team-wr-open { overflow: hidden; }

    /* ══════════════════════════════════════════════════════════
       SEASON LOG TABLE
    ══════════════════════════════════════════════════════════ */
    .team-table-wrap {
      overflow-x: auto; margin-bottom: 2.5rem;
    }
    .team-table {
      width: 100%; border-collapse: collapse;
      font-family: var(--font-body); font-size: 0.68rem;
    }
    .team-table th {
      font-size: 0.44rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--accent-dim); font-weight: 300;
      padding: 0.5rem 0.75rem; text-align: left;
      border-bottom: 1px solid var(--drawer-border);
      white-space: nowrap;
    }
    .team-table th.num { text-align: right; }
    .team-table td {
      padding: 0.65rem 0.75rem; border-bottom: 1px solid rgba(232,232,232,0.05);
      color: var(--accent); vertical-align: middle; white-space: nowrap; font-weight: 600;
    }
    .team-table td.num { text-align: right; color: var(--accent); }
    .team-table td.team-name-cell { color: var(--accent); }
    .team-table tr:last-child td { border-bottom: none; }
    .team-table tr:hover td { background: rgba(255,255,255,0.06); }

    /* Result badges */
    .result-badge {
      display: inline-block;
      font-family: var(--font-body); font-size: 0.42rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      padding: 0.18rem 0.45rem; border: 1px solid;
    }
    .result-badge.champ {
      color: var(--team-primary, var(--hint-color, var(--accent)));
      border-color: var(--team-primary, var(--hint-color, var(--drawer-border)));
    }
    .result-badge.finals  { color: var(--accent-dim); border-color: var(--drawer-border); }
    .result-badge.semis   { color: var(--accent-dim); border-color: var(--drawer-border); }
    .result-badge.wild    { color: var(--accent-dim); border-color: var(--drawer-border); }
    .result-badge.miss    { color: rgba(232,232,232,0.2); border-color: rgba(232,232,232,0.1); }

    /* Mini logo in season row */
    .season-team-logo {
      width: 18px; height: 18px; object-fit: contain;
      vertical-align: middle; margin-right: 0.4rem;
    }

    /* ══════════════════════════════════════════════════════════
       HEAD TO HEAD
    ══════════════════════════════════════════════════════════ */
    .team-h2h-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem; margin-bottom: 2.5rem;
    }
    .team-h2h-card {
      border: 1px solid var(--drawer-border);
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(4px);
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .team-h2h-card:hover {
      border-color: rgba(232,232,232,0.2);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
    }
    .team-h2h-card-header {
      display: flex; align-items: center; gap: 0.65rem;
      padding: 0.75rem 0.85rem; border-bottom: 1px solid var(--drawer-border);
      cursor: pointer; user-select: none;
      transition: background 0.2s;
    }
    .team-h2h-card-header:hover { background: rgba(255,255,255,0.03); }
    .team-h2h-thumb {
      width: 40px; height: 40px; border-radius: 0;
      object-fit: contain;
      flex-shrink: 0;
      background: transparent;
    }
    .team-h2h-thumb-init {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--drawer-border); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-size: 0.9rem;
      color: var(--accent-dim); background: rgba(255,255,255,0.04);
    }
    .team-h2h-info { flex: 1; min-width: 0; }
    .team-h2h-name {
      font-family: var(--font-display); font-weight: 600;
      font-size: 1rem; color: var(--accent); line-height: 1;
      margin-bottom: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .team-h2h-record {
      font-family: var(--font-body); font-size: 0.58rem;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); font-weight: 700;
    }
    .team-h2h-record .win  { color: var(--team-primary, var(--hint-color, var(--accent))); }

    /* Win bar */

    /* Season breakdown */

    .team-h2h-season-row {
      display: flex; justify-content: space-between; align-items: center;

    .team-h2h-season-row:last-child { border-bottom: none; }
    .team-h2h-season-year { color: var(--accent-dim); letter-spacing: 0.12em; }
    .team-h2h-season-result {
      font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--accent-dim); font-weight: 700;
    }
    .team-h2h-season-result.w { color: var(--team-primary, var(--hint-color, var(--accent))); }
    .team-h2h-rivalry-link {
      display: block; margin-top: 0.55rem; padding-top: 0.5rem;
      border-top: 1px solid var(--drawer-border);
      font-family: var(--font-body); font-size: 0.5rem; letter-spacing: 0.28em;
      text-transform: uppercase; text-align: center; text-decoration: none;

      opacity: 0.8; transition: opacity 0.2s;
    }
    .team-h2h-rivalry-link:hover { opacity: 1; }

    /* ══════════════════════════════════════════════════════════
       MVP LOG
    ══════════════════════════════════════════════════════════ */
    .team-mvp-grid {
      display: grid;

      border: 1px solid var(--drawer-border);
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(4px);

    }
    .team-mvp-season-card:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(232,232,232,0.2);
      transform: translateY(-2px);
    }
    .team-mvp-season-year {
      font-family: var(--font-body); font-size: 0.44rem;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--hint-color, var(--accent-dim)); margin-bottom: 0.5rem; font-weight: 700;
    }
    .team-mvp-week-list {
      display: flex; flex-wrap: wrap; gap: 0.3rem;

    .team-mvp-week-chip {

    .team-history-list {

<body>

  <!-- ── TOP NAV ──────────────────────────────────────────── -->
  <nav class="topnav" role="navigation" aria-label="Site navigation">
    <a href="index.html" class="topnav-logo">OFC</a>
    <button class="menu-trigger" aria-label="Open navigation menu" aria-expanded="false" aria-controls="site-drawer">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- ── DRAWER ───────────────────────────────────────────── -->
  <div class="drawer-overlay" aria-hidden="true"></div>
  <aside id="site-drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Navigation">
    <p class="drawer-label">Navigate</p>
    <ul class="drawer-nav"></ul>
    <div class="drawer-footer"></div>
  </aside>

  <!-- ── TEAM PAGE ────────────────────────────────────────── -->
  <div class="team-page" id="teamPage">

    <div class="slide-layer" id="slideA" aria-hidden="true"></div>
    <div class="slide-layer" id="slideB" aria-hidden="true"></div>
    <div class="landing-overlay" id="teamOverlay" aria-hidden="true"></div>
    <div class="landing-vignette" aria-hidden="true"></div>

    <div id="teamContent"></div>

  </div>

  <script src="sound.js"></script>
  <script src="menu.js"></script>

  <script>
  (function () {
    'use strict';

    /* ── Helpers ──────────────────────────────────────────── */
    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function getParam(key) {
      var params = new URLSearchParams(window.location.search);
      return params.get(key);
    }

    function initials(name) {
      return (name || '?').split(' ').map(function (w) { return w[0]; }).join('').slice(0,2).toUpperCase();
    }

    /* ── Get OFC league entry for a member ───────────────── */
    function getOFCEntry(member) {
      if (!member || !member.leagues) return null;
      return member.leagues.find(function (lg) { return lg.leagueKey === 'OFC'; }) || null;
    }

    /* ── Get current (last) team ──────────────────────────── */
    function getCurrentTeam(ofcEntry) {
      if (!ofcEntry || !ofcEntry.teams || !ofcEntry.teams.length) return null;
      return ofcEntry.teams[ofcEntry.teams.length - 1];
    }

    /* ── Find OFC league in leagueData ────────────────────── */
    function getOFCLeague(leagueData) {
      return (leagueData || []).find(function (lg) { return lg.sport === 'football'; }) || null;
    }

    /* ── Build custom slideshow from team logos ───────────── */
    var KB_DIRS = ['kb-zoom-in','kb-zoom-out','kb-pan-right','kb-pan-left','kb-drift-up'];
    function buildTeamSlideshow(ofcEntry, config) {
      if (!ofcEntry || !ofcEntry.teams) return null;
      var logos = ofcEntry.teams.map(function (t) { return t.logo; }).filter(Boolean);
      if (!logos.length) return null;

      var ss = config.slideshow || {};
      var slides;
      if (logos.length === 1) {
        // Single logo — generate 5 varied keyframe directions
        slides = KB_DIRS.map(function (dir) { return { image: logos[0], direction: dir }; });
      } else {
        // Multiple logos — cycle each with a varied direction
        slides = logos.map(function (logo, i) {
          return { image: logo, direction: KB_DIRS[i % KB_DIRS.length] };
        });
      }

      return {
        slides:          slides,
        overlay:         ss.overlay         || 'rgba(0,0,0,0.62)',
        displayDuration: ss.displayDuration || 8000,
        fadeDuration:    ss.fadeDuration    || 2000
      };
    }

    /* ── Apply team color CSS vars ────────────────────────── */
    function applyTeamColors(currentTeam) {
      var root = document.documentElement;
      if (currentTeam && currentTeam.primaryColor) {
        root.style.setProperty('--team-primary', currentTeam.primaryColor);
      }
      if (currentTeam && currentTeam.secondaryColor) {
        root.style.setProperty('--team-secondary', currentTeam.secondaryColor);
      }
    }

    /* ── Run the team slideshow (standalone, not via menu.js) */
    function runTeamSlideshow(ss) {
      if (!ss || !ss.slides || !ss.slides.length) return;
      var slideA  = document.getElementById('slideA');
      var slideB  = document.getElementById('slideB');
      if (!slideA || !slideB) return;

      var slides     = ss.slides;
      var total      = slides.length;
      var displayMs  = ss.displayDuration || 8000;
      var fadeMs     = ss.fadeDuration    || 2000;
      var cycleMs    = displayMs + fadeMs;
      var currentIdx = 0;
      var activLayer = slideA;
      var inactLayer = slideB;

      slides.forEach(function (s) { var img = new Image(); img.src = s.image; });

      function applySlide(layer, slide) {
        layer.style.backgroundImage    = 'url("' + slide.image + '")';
        layer.style.animationName      = slide.direction || 'kb-zoom-in';
        layer.style.animationDuration  = cycleMs + 'ms';
        layer.style.animationDelay     = '0ms';
        layer.style.animationPlayState = 'paused';
        layer.classList.add('kb-active');
      }
      function resetLayer(layer) {
        layer.classList.remove('kb-active');
        layer.style.animation = 'none';
        void layer.offsetWidth;
        layer.style.animation = '';
      }
      function showSlide(idx) {
        applySlide(inactLayer, slides[idx]);
        activLayer.style.zIndex  = '1';
        inactLayer.style.zIndex  = '2';
        inactLayer.style.animationPlayState = 'running';
        inactLayer.classList.add('is-active');
        setTimeout(function () {
          activLayer.classList.remove('is-active');
          var out = activLayer; activLayer = inactLayer; inactLayer = out;
          setTimeout(function () { resetLayer(inactLayer); }, 50);
        }, fadeMs);
      }

      applySlide(slideA, slides[0]);
      slideA.style.zIndex = '2'; slideB.style.zIndex = '1';
      slideA.style.animationPlayState = 'running';
      slideA.classList.add('is-active');
      activLayer = slideA; resetLayer(slideB); inactLayer = slideB;
      if (total === 1) return;

      function cycle() {
        currentIdx = (currentIdx + 1) % total;
        showSlide(currentIdx);
        setTimeout(cycle, cycleMs);
      }
      setTimeout(cycle, cycleMs);
    }

    /* ══════════════════════════════════════════════════════════
       DATA COMPUTATIONS
    ══════════════════════════════════════════════════════════ */

    /* ── Season log for this member in OFC ───────────────── */
    function buildSeasonLog(memberId, ofcLeague, ofcEntry) {
      if (!ofcLeague) return [];
      var seasons = (ofcLeague.seasons || []).slice().sort(function (a, b) {
        return (parseInt(b.year,10)||0) - (parseInt(a.year,10)||0);
      });

      return seasons.map(function (season) {
        var row = (season.standings || []).find(function (r) { return r.memberId === memberId; });
        if (!row) return null;

        // Playoff result
        var playoffResult = getPlayoffResult(memberId, season, ofcLeague);

        // Team logo — find matching team entry by name
        var logoSrc = '';
        if (row.teamName && ofcEntry) {
          var teamEntry = (ofcEntry.teams || []).find(function (t) { return t.name === row.teamName; });
          if (teamEntry) logoSrc = teamEntry.logo || '';
        }

        // Finish rank
        var standings = (season.standings || []).slice().sort(function (a, b) {
          return (parseFloat(b.totalPoints)||0) - (parseFloat(a.totalPoints)||0);
        });
        var rank = standings.findIndex(function (r) { return r.memberId === memberId; }) + 1;

        return {
          year:         season.year || '?',
          teamName:     row.teamName || '—',
          logo:         logoSrc,
          record:       (row.record || ''),
          pointsFor:    row.pointsFor    || row.totalPoints || '',
          pointsAgainst:row.pointsAgainst || '',
          rank:         rank,
          playoff:      playoffResult,
          isChamp:      season.championMemberId === memberId,
          wrapped:      !!season.isFinal && (season.weeks || []).some(function (w) { return w.isComplete; }),
          luck:         (function () {
            if (!season.isFinal) return null;
            var allWeeks = (season.weeks || []).filter(function (w) { return w.isComplete; });
            if (!allWeeks.length) return null;
            var memberIds = (season.standings || []).map(function (r) { return r.memberId; }).filter(Boolean);
            var luckTotal = 0;
            allWeeks.forEach(function (wk) {
              var weekScores = {}, actualWins = {};
              memberIds.forEach(function (mid) { weekScores[mid] = 0; actualWins[mid] = 0; });
              (wk.games || []).forEach(function (g) {
                var hid = g.home && g.home.memberId;
                var aid = g.away && g.away.memberId;
                var hs  = parseFloat(g.home && g.home.score) || 0;
                var as_ = parseFloat(g.away && g.away.score) || 0;
                if (hid) weekScores[hid] = hs;
                if (aid) weekScores[aid] = as_;
                if (hid && aid) {
                  if (hs > as_) actualWins[hid] = 1;
                  else if (as_ > hs) actualWins[aid] = 1;
                }
              });
              var allSc = Object.values(weekScores).filter(function (s) { return s > 0; });
              var n = allSc.length;
              var my = weekScores[memberId] || 0;
              if (!my) return;
              var exp = allSc.filter(function (s) { return my > s; }).length;
              var expPct = n > 1 ? exp / (n - 1) : 0;
              luckTotal += (actualWins[memberId] || 0) - expPct;
            });
            return luckTotal;
          })()
        };
      }).filter(Boolean);
    }

    /* ── Determine playoff result from bracket data ─────── */
    function getPlayoffResult(memberId, season, league) {
      if (!season.isFinal) return null;
      var p = season.playoffs;
      if (!p) return 'missed';

      var inFinals      = false;
      var inSemis       = false;
      var inWild        = false;
      var wonFinals     = false;
      var wonSemis      = false;

      // Check finals
      var finals = p.finals || [];
      finals.forEach(function (g) {
        if (g.homeMemberId === memberId || g.awayMemberId === memberId) {
          inFinals = true;
          var homeWon = parseFloat(g.homeScore) > parseFloat(g.awayScore);
          if ((g.homeMemberId === memberId && homeWon) || (g.awayMemberId === memberId && !homeWon)) {
            wonFinals = true;
          }
        }
      });

      var semis = p.semis || [];
      semis.forEach(function (g) {
        if (g.homeMemberId === memberId || g.awayMemberId === memberId) {
          inSemis = true;
          var homeWon = parseFloat(g.homeScore) > parseFloat(g.awayScore);
          if ((g.homeMemberId === memberId && homeWon) || (g.awayMemberId === memberId && !homeWon)) {
            wonSemis = true;
          }
        }
      });

      var wild = p.wildcard || [];
      wild.forEach(function (g) {
        if (g.homeMemberId === memberId || g.awayMemberId === memberId) inWild = true;
      });

      if (season.championMemberId === memberId) return 'champion';
      if (inFinals)  return 'finals';
      if (wonSemis)  return 'finals';  // won semis = reached finals
      if (inSemis)   return 'semis';
      if (inWild)    return 'wildcard';
      return 'missed';
    }

    /* ── Career overview stats ────────────────────────────── */
    function buildCareerStats(memberId, ofcLeague) {
      var wins = 0, losses = 0, ties = 0;
      var playoffAppearances = 0, championships = 0, finalAppearances = 0;
      var mvpCount = 0;

      if (!ofcLeague) return { wins, losses, ties, playoffAppearances, championships, finalAppearances, mvpCount, winPct: 0, seasonsPlayed: 0 };

      (ofcLeague.seasons || []).forEach(function (season) {
        var row = (season.standings || []).find(function (r) { return r.memberId === memberId; });
        if (!row) return;

        // Parse W-L-T from record string e.g. "10-3" or "9-3-1"
        if (row.record) {
          var parts = row.record.split('-').map(Number);
          wins    += parts[0] || 0;
          losses  += parts[1] || 0;
          ties    += parts[2] || 0;
        }

        var pr = getPlayoffResult(memberId, season, ofcLeague);
        if (pr !== 'missed')    playoffAppearances++;
        if (pr === 'champion')  championships++;
        if (pr === 'champion' || pr === 'finals') finalAppearances++;

        // MVPs
        (season.weeks || []).forEach(function (week) {
          if (week.highScorer && week.highScorer.memberId === memberId) mvpCount++;
        });
      });

      var seasonsPlayed = (ofcLeague.seasons || []).filter(function (s) {
        return (s.standings || []).some(function (r) { return r.memberId === memberId; });
      }).length;

      var totalGames = wins + losses + ties;
      var winPct = totalGames > 0 ? ((wins + ties * 0.5) / totalGames) : 0;

      return { wins, losses, ties, playoffAppearances, championships, finalAppearances, mvpCount, winPct, seasonsPlayed };
    }

    /* ── Head-to-head records ─────────────────────────────── */
    function buildH2H(memberId, ofcLeague, roster) {
      var records = {}; // opponentId → { wins, losses, ties, seasons: [] }

      if (!ofcLeague) return [];

      (ofcLeague.seasons || []).forEach(function (season) {
        (season.weeks || []).forEach(function (week) {
          (week.games || []).forEach(function (game) {
            /* Support both nested {home,away} and flat homeMemberId shapes */
            var homeId    = (game.home && game.home.memberId) || game.homeMemberId || '';
            var awayId    = (game.away && game.away.memberId) || game.awayMemberId || '';
            var homeScore = parseFloat((game.home && game.home.score) || game.homeScore || 0);
            var awayScore = parseFloat((game.away && game.away.score) || game.awayScore || 0);

            var isHome = homeId === memberId;
            var isAway = awayId === memberId;
            if (!isHome && !isAway) return;

            var oppId = isHome ? awayId : homeId;
            if (!oppId) return;

            var myScore  = isHome ? homeScore : awayScore;
            var oppScore = isHome ? awayScore : homeScore;

            if (!records[oppId]) records[oppId] = { wins: 0, losses: 0, ties: 0, seasons: {} };
            var rec = records[oppId];

            if (!rec.seasons[season.year]) rec.seasons[season.year] = { wins: 0, losses: 0, ties: 0 };
            var seasonRec = rec.seasons[season.year];

            if (myScore > oppScore)       { rec.wins++;   seasonRec.wins++;   }
            else if (myScore < oppScore)  { rec.losses++; seasonRec.losses++; }
            else                          { rec.ties++;   seasonRec.ties++;   }
          });
        });
      });

      // Convert to array with opponent info
      return Object.keys(records).map(function (oppId) {
        var rec    = records[oppId];
        var member = (roster || []).find(function (m) { return m.id === oppId; });
        var ofcLg  = member ? (member.leagues || []).find(function (lg) { return lg.leagueKey === 'OFC'; }) : null;
        var teams  = ofcLg ? (ofcLg.teams || []) : [];
        var currentTeam = teams.length ? teams[teams.length - 1] : null;
        var currentTeamName = currentTeam ? currentTeam.name : (member ? member.name : 'Unknown');
        return {
          oppId:   oppId,
          name:    currentTeamName,
          logo:    currentTeam ? (currentTeam.logo || '') : '',
          mugshot: member ? member.mugshot : '',
          wins:    rec.wins,
          losses:  rec.losses,
          ties:    rec.ties,
          seasons: rec.seasons
        };
      }).sort(function (a, b) {
        var aTotal = a.wins + a.losses + a.ties;
        var bTotal = b.wins + b.losses + b.ties;
        if (bTotal !== aTotal) return bTotal - aTotal;
        return (a.name || '').localeCompare(b.name || '');
      });
    }

    /* ── MVP log by season ────────────────────────────────── */
    function buildMVPLog(memberId, ofcLeague) {
      if (!ofcLeague) return [];
      var seasons = [];
      (ofcLeague.seasons || []).forEach(function (season) {
        var weeks = [];
        (season.weeks || []).forEach(function (week) {
          if (week.highScorer && week.highScorer.memberId === memberId) {
            weeks.push(week.weekNumber || '?');
          }
        });
        if (weeks.length) {
          seasons.push({ year: season.year || '?', weeks: weeks, count: weeks.length });
        }
      });
      return seasons.sort(function (a, b) { return (parseInt(b.year,10)||0) - (parseInt(a.year,10)||0); });
    }

       RENDER

    function renderPlayoffBadge(result) {
      if (!result) return '';
      var labels = {
        champion: '&#x2605; Champion',
        finals:   'Finals',
        semis:    'Semis',
        wildcard: 'Wildcard',
        missed:   'Missed'
      };
      return '<span class="result-badge ' + result + '">' + (labels[result] || result) + '</span>';
    }

    // ── Compute cross-season power ranking tier ───────────────
    function computePowerTier(memberId, ofcLeague) {
      if (!ofcLeague) return null;
      var finalSeasons = (ofcLeague.seasons || []).filter(function (s) { return s.isFinal; });
      if (!finalSeasons.length) return null;

      // Get last 3 final seasons
      var recent = finalSeasons.slice(0, 3);

      // Score each season: compute season power score for this member
      function seasonScore(season) {
        var weeks = (season.weeks || []).filter(function (w) { return w.isComplete; });
        var allScores = [];
        weeks.forEach(function (wk) {
          (wk.games || []).forEach(function (g) {
            var hid = g.home && g.home.memberId;
            var aid = g.away && g.away.memberId;
            if (hid === memberId) allScores.push(parseFloat(g.home.score) || 0);
            if (aid === memberId) allScores.push(parseFloat(g.away.score) || 0);
          });
        });
        var REAL_PO = { 'Semifinal': true, 'Championship': true };
        var p = season.playoffs || {};
        ['wildcard','semis','finals'].forEach(function (round) {
          (p[round] || []).forEach(function (g) {
            if (g.gameType && !REAL_PO[g.gameType]) return;
            if (g.homeMemberId === memberId) allScores.push(parseFloat(g.homeScore) || 0);
            else if (g.awayMemberId === memberId) allScores.push(parseFloat(g.awayScore) || 0);
          });
        });
        if (!allScores.length) return 0;
        var avg = allScores.reduce(function (s, v) { return s + v; }, 0) / allScores.length;
        var last3 = allScores.slice(-3).reverse();
        var weights = [0.5, 0.3, 0.2];
        var w3 = 0, wSum = 0;
        last3.forEach(function (s, i) { var w = weights[i] || 0.1; w3 += s * w; wSum += w; });
        return (avg * 0.6) + ((wSum > 0 ? w3 / wSum : avg) * 0.4);
      }

      // Weight seasons: most recent 50%, next 30%, oldest 20%
      var seasonWeights = [0.5, 0.3, 0.2];
      var totalScore = 0, wSum = 0;
      recent.forEach(function (s, i) {
        var w = seasonWeights[i] || 0.1;
        totalScore += seasonScore(s) * w;
        wSum += w;
      });
      var myScore = wSum > 0 ? totalScore / wSum : 0;
      if (!myScore) return null;

      // Rank against all members using same formula
      var allMembers = [];
      (ofcLeague.seasons || []).slice(0, 1).forEach(function (s) {
        (s.standings || []).forEach(function (r) { if (r.memberId) allMembers.push(r.memberId); });
      });
      // Fall back to all unique memberIds across recent seasons
      if (!allMembers.length) {
        var seen = {};
        recent.forEach(function (s) {
          (s.standings || []).forEach(function (r) {
            if (r.memberId && !seen[r.memberId]) { seen[r.memberId] = true; allMembers.push(r.memberId); }
          });
        });
      }

      var allScored = allMembers.map(function (mid) {
        var ts = 0, ws = 0;
        recent.forEach(function (s, i) {
          var w = seasonWeights[i] || 0.1;
          ts += seasonScore(s) * w; // simplified — reuse seasonScore
          ws += w;
        });
        return mid; // We'll rank by actual scores below
      });

      // Proper ranking
      var ranked = allMembers.map(function (mid) {
        var ts = 0, ws = 0;
        recent.forEach(function (s, i) {
          var wks = (s.weeks || []).filter(function (w) { return w.isComplete; });
          var scores = [];
          wks.forEach(function (wk) {
            (wk.games || []).forEach(function (g) {
              var hid = g.home && g.home.memberId;
              var aid = g.away && g.away.memberId;
              if (hid === mid) scores.push(parseFloat(g.home.score) || 0);
              if (aid === mid) scores.push(parseFloat(g.away.score) || 0);
            });
          });
          var REAL_PO2 = { 'Semifinal': true, 'Championship': true };
          var p2 = s.playoffs || {};
          ['wildcard','semis','finals'].forEach(function (round) {
            (p2[round] || []).forEach(function (g) {
              if (g.gameType && !REAL_PO2[g.gameType]) return;
              if (g.homeMemberId === mid) scores.push(parseFloat(g.homeScore) || 0);
              else if (g.awayMemberId === mid) scores.push(parseFloat(g.awayScore) || 0);
            });
          });
          if (!scores.length) return;
          var avg2 = scores.reduce(function (a, v) { return a + v; }, 0) / scores.length;
          var l3 = scores.slice(-3).reverse();
          var w3b = 0, ws3 = 0;
          l3.forEach(function (sc, j) { var wj = [0.5,0.3,0.2][j] || 0.1; w3b += sc * wj; ws3 += wj; });
          var sc2 = (avg2 * 0.6) + ((ws3 > 0 ? w3b / ws3 : avg2) * 0.4);
          var sw = seasonWeights[i] || 0.1;
          ts += sc2 * sw; ws += sw;
        });
        return { memberId: mid, score: ws > 0 ? ts / ws : 0 };
      }).sort(function (a, b) { return b.score - a.score; });

      var n = ranked.length;
      var myRank = ranked.findIndex(function (r) { return r.memberId === memberId; }) + 1;
      if (!myRank) return null;

      var pct = myRank / n;
      if (pct <= 0.15)      return { tier: 'Dynasty',    color: '#e8c864' };
      if (pct <= 0.35)      return { tier: 'Contender',  color: '#b0b8c8' };
      if (pct <= 0.5)       return { tier: 'Rising',     color: '#4caf7d' };
      if (pct <= 0.65)      return { tier: 'Steady',     color: 'var(--accent-dim)' };
      if (pct <= 0.85)      return { tier: 'Fading',     color: '#e0944a' };
      return                       { tier: 'Rebuilding', color: '#d94f4f' };
    }

       Uses ofl-engine.js (same simulation + seed as race.html)
       and ofl-newsroom.js (latest Gazette mention).
       Hidden in the offseason / preseason / if the engine is missing.
    ═════════════════════════════════════════════════════ */
    function buildThisSeason(member) {
      var slot = document.getElementById('tsnSlot');
      var E = window.OFL_ENGINE, N = window.OFL_NEWSROOM;
      if (!slot || !E) return;
      var S = E.ofc.seasons[0];
      if (!S || S.isFinal) return;
      var m = member.id, ids = E.ofc.teamIds(S);
      if (ids.indexOf(m) < 0) return;
      var K = E.ofc.lastDone(S), yr = parseInt(S.year, 10), R = E.ofc.regWeeks(S);
      var st = E.ofc.standingsThrough(S, K), me = st.map[m];
      if (!me || !K) return;
      var f2 = E.util.f2, ord = E.util.ord, pctTxt = E.util.pctTxt, rec = E.ofc.rec;
      function ident(id) {
        if (N && N.ofc && N.ofc.ident) return N.ofc.ident(id, (st.map[id] || {}).name);
        var mm = E.util.member(id); return { owner: mm.name || '?', team: (st.map[id] || {}).name || mm.name || '?', logo: mm.mugshot || '', color: '#888888' };
      }
      function logo(I) { return I.logo ? '<img src="' + esc(I.logo) + '" alt="" />' : '<div class="tsn-init">' + esc(initials(I.team)) + '</div>'; }
      function pp(v) { return pctTxt(v) + '%'; }

      /* Week by week */
      var log = [];
      E.ofc.completeWeeks(S).forEach(function (w) {
        var gs = E.ofc.gamesOf(w), all = [], mine = null;
        gs.forEach(function (g) {
          all.push(g.hs, g.as);
          if (g.h === m) mine = { s: g.hs, o: g.a, os: g.as }; else if (g.a === m) mine = { s: g.as, o: g.h, os: g.hs };
        });
        if (!mine) return;
        mine.k = w.weekNumber; mine.avg = all.reduce(function (a, b) { return a + b; }, 0) / all.length;
        mine.res = mine.s > mine.os ? 'W' : mine.s < mine.os ? 'L' : 'T';
        log.push(mine);
      });
      var pfRank = st.rows.slice().sort(function (a, b) { return b.pf - a.pf; }).findIndex(function (r) { return r.id === m; }) + 1;

      /* Rest of the season: the same 10,000-season simulation the Playoff Race runs */
      var sched = E.ofc.remainingSchedule(S, K), games = sched.games, base = {};
      ids.forEach(function (id) { var r = st.map[id]; base[id] = r ? { w: r.w, t: r.t, pf: r.pf } : { w: 0, t: 0, pf: 0 }; });
      var model = E.ofc.scoringModel(S, K, ids), res = null, mine = null;
      if (games.length) { res = E.ofc.simulate(E.ofc.SIMS, games, {}, model, base, E.ofc.SEED, ids, E.ofc.PLAYOFF_TEAMS); mine = res[m]; }
      var odds = mine ? mine.playoff : (me.rank <= E.ofc.PLAYOFF_TEAMS ? 1 : 0);

      var statusTxt, statusCol;
      if (!games.length) { statusTxt = odds ? 'Playoff Bound' : 'Season Over'; statusCol = odds ? '#4caf7d' : '#d94f4f'; }
      else if (odds >= 0.995) { statusTxt = 'All But In'; statusCol = '#4caf7d'; }
      else if (odds >= 0.6) { statusTxt = 'In Control'; statusCol = '#4caf7d'; }
      else if (odds >= 0.35) { statusTxt = 'On the Bubble'; statusCol = '#e8c864'; }
      else if (odds >= 0.005) { statusTxt = 'Need Help'; statusCol = '#e8935a'; }
      else { statusTxt = 'All But Out'; statusCol = '#d94f4f'; }

      var streak = me.streak ? me.streak.type + me.streak.n : '—';

      /* ── Left column: tiles + chart ── */
      var tiles =
        '<div class="tsn-tiles">' +
          '<div class="tsn-tile"><div class="tsn-tile-v">' + rec(me) + '</div><div class="tsn-tile-l">Record</div><div class="tsn-tile-s">' + ord(me.rank) + ' of ' + st.rows.length + '</div></div>' +
          '<div class="tsn-tile"><div class="tsn-tile-v">' + Math.round(me.pf) + '</div><div class="tsn-tile-l">Points For</div><div class="tsn-tile-s">' + ord(pfRank) + ' in league</div></div>' +
          '<div class="tsn-tile"><div class="tsn-tile-v">' + streak + '</div><div class="tsn-tile-l">Streak</div><div class="tsn-tile-s">' + (me.streak && me.streak.type === 'W' ? 'Rolling' : me.streak && me.streak.type === 'L' ? 'Skidding' : '&nbsp;') + '</div></div>' +
          '<div class="tsn-tile"><div class="tsn-tile-v is-team">' + pp(odds) + '</div><div class="tsn-tile-l">Playoff Odds</div><svg class="tsn-spark" id="tsnSpark" viewBox="0 0 100 22" preserveAspectRatio="none" aria-hidden="true"></svg></div>' +
        '</div>';

      /* Weekly scores: played weeks as bars, remaining weeks as dashed slots with the opponent */
      var upcoming = games.filter(function (g) { return g.h === m || g.a === m; }).sort(function (a, b) { return a.week - b.week; });
      var maxS = Math.max.apply(null, log.map(function (x) { return Math.max(x.s, x.avg); }).concat([150]));
      var nW = Math.max(R, log.length ? log[log.length - 1].k : 0), CW = 340, CH = 120, gap = 3, bw = (CW - gap * (nW - 1)) / nW;
      function y(v) { return CH - (v / maxS) * (CH - 14); }
      var bars = '', avgPts = [];
      for (var wk = 1; wk <= nW; wk++) {
        var x = (wk - 1) * (bw + gap), L = log.find(function (q) { return q.k === wk; });
        if (L) {
          var oI = ident(L.o);
          bars += '<g class="bar"><title>Week ' + wk + ': ' + f2(L.s) + ' vs ' + esc(oI.team) + ' ' + f2(L.os) + ' (' + L.res + ')</title>' +
            '<rect class="' + (L.res === 'W' ? 'b-w' : 'b-l') + '" x="' + x.toFixed(1) + '" y="' + y(L.s).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (CH - y(L.s)).toFixed(1) + '" rx="1.5"/>' +
            (bw >= 16 ? '<text class="sc" x="' + (x + bw / 2).toFixed(1) + '" y="' + (y(L.s) - 3).toFixed(1) + '" text-anchor="middle">' + Math.round(L.s) + '</text>' : '') + '</g>';
          avgPts.push((x + bw / 2).toFixed(1) + ',' + y(L.avg).toFixed(1));
        } else {
          var U = upcoming.find(function (g) { return g.week === wk; }), uI = U ? ident(U.h === m ? U.a : U.h) : null;
          bars += '<g class="bar">' + (uI ? '<title>Week ' + wk + ': vs ' + esc(uI.team) + '</title>' : '') +
            '<rect class="b-f" x="' + x.toFixed(1) + '" y="' + (CH * 0.35).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (CH * 0.65).toFixed(1) + '" rx="1.5"/>' +
            (uI && bw >= 16 ? '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (CH * 0.35 + 12).toFixed(1) + '" text-anchor="middle">' + esc(initials(uI.owner)) + '</text>' : '') + '</g>';
        }
        bars += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (CH + 12) + '" text-anchor="middle">' + wk + '</text>';
      }
      var chart = '<p class="tsn-sub"><span>Weekly Scores</span><span>' + K + ' played &middot; ' + Math.max(0, R - K) + ' to go</span></p>' +
        '<svg class="tsn-chart" viewBox="0 0 ' + CW + ' ' + (CH + 16) + '" role="img" aria-label="Weekly scores this season">' + bars +
          (avgPts.length > 1 ? '<polyline class="avg" points="' + avgPts.join(' ') + '"/>' : '') + '</svg>' +
        '<div class="tsn-legend"><span><i class="k-w"></i>Win</span><span><i class="k-l"></i>Loss</span><span><i class="k-a"></i>League average</span><span>Dashed slots = still to play</span></div>';

      /* ── Right column: next matchup + path ── */
      var right = '';
      var next = upcoming[0];
      if (next) {
        var home = next.h === m, opp = home ? next.a : next.h, oI = ident(opp), mI = ident(m);
        var mu1 = model[m].mu, mu2 = model[opp].mu, sd = Math.sqrt(model[m].sd * model[m].sd + model[opp].sd * model[opp].sd);
        var wp = normCdf((mu1 - mu2) / (sd || 1));
        var oRow = st.map[opp];
        var ser = N && N.seriesThrough ? N.seriesThrough(m, opp, yr, K) : null;
        var gi = games.indexOf(next), idx = res._idx[m], hw = res._gHW[gi], n = res._n;
        var poHW = hw ? res._gamePO[gi][idx] / hw : null, poHL = (n - hw) ? (res._poTotal[idx] - res._gamePO[gi][idx]) / (n - hw) : null;
        var ifWin = home ? poHW : poHL, ifLose = home ? poHL : poHW;
        right += '<p class="tsn-sub"><span>Next Up &middot; Week ' + next.week + '</span><span>' + (sched.source === 'pattern' && !(S.weeks || []).some(function (w) { return w.weekNumber === next.week && (w.games || []).length; }) ? 'Projected matchup' : 'Projection') + '</span></p>' +
          '<div class="tsn-next" style="--oc:' + (oI.color || '#555') + '">' +
            '<div class="tsn-vs">' +
              '<div class="tsn-side">' + logo(mI) + '<div class="tsn-side-n">' + esc(mI.team) + '</div><div class="tsn-side-r">' + rec(me) + '</div><div class="tsn-side-p">' + f2(mu1) + '</div></div>' +
              '<div class="tsn-at">VS</div>' +
              '<div class="tsn-side">' + logo(oI) + '<div class="tsn-side-n">' + esc(oI.team) + '</div><div class="tsn-side-r">' + (oRow ? rec(oRow) + ' &middot; ' + ord(oRow.rank) : '') + '</div><div class="tsn-side-p">' + f2(mu2) + '</div></div>' +
            '</div>' +
            '<div class="tsn-wp"><div class="tsn-wp-bar"><i class="me" style="width:' + (wp * 100).toFixed(1) + '%"></i><i class="op" style="width:' + ((1 - wp) * 100).toFixed(1) + '%"></i></div>' +
              '<div class="tsn-wp-lab"><span>' + Math.round(wp * 100) + '% win</span><span>' + Math.round((1 - wp) * 100) + '%</span></div></div>' +
            (ifWin !== null && ifLose !== null ?
              '<div class="tsn-swing"><div class="up"><b>' + pp(ifWin) + '</b><span>Playoff odds with a win</span></div><div class="dn"><b>' + pp(ifLose) + '</b><span>With a loss</span></div></div>' : '') +
            '<p class="tsn-note">' +
              (ser && (ser.a + ser.b + ser.t) ? 'All-time vs ' + esc(oI.owner) + ': <b>' + ser.a + '&ndash;' + ser.b + (ser.t ? '&ndash;' + ser.t : '') + '</b>. ' : 'First-ever meeting. ') +
              (ifWin !== null && ifLose !== null && Math.abs(ifWin - ifLose) >= 0.15 ? 'This one swings <b>' + Math.round(Math.abs(ifWin - ifLose) * 100) + ' points</b> of playoff odds. Big game.' :
               ifWin !== null && ifLose !== null && Math.abs(ifWin - ifLose) < 0.04 ? 'Not much riding on it either way.' : '') +
              ' <a href="rivals.html?a=' + encodeURIComponent(m) + '&b=' + encodeURIComponent(opp) + '" style="color:var(--accent);">Full rivalry &#x2197;</a></p>' +
          '</div>';
      }

      if (mine && mine.byWins && mine.rem) {
        var bk = mine.byWins, mark = -1;
        for (var q = 0; q < bk.length; q++) if (bk[q].n && bk[q].po >= 0.9) { mark = q; break; }
        right += '<p class="tsn-sub"><span>Path to the Playoffs</span><span>Wins in last ' + mine.rem + '</span></p>' +
          '<div class="tsn-path">' + bk.map(function (b) {
            return '<div class="' + (b.k === mark ? 'is-mark' : '') + '" style="--h:' + (b.n ? Math.round(b.po * 100) : 0) + '%" title="Win ' + b.k + ' of ' + mine.rem + ': ' + (b.n ? pp(b.po) : 'did not happen in the simulations') + '">' +
              '<b>' + (b.n ? pctTxt(b.po) : '–') + '</b><span>' + b.k + 'W</span></div>';
          }).join('') + '</div>' +
          '<p class="tsn-note">' + (mark === 0 ? 'Could lose out and <b>still</b> get in most of the time.' :
            mark > 0 ? 'Win <b>' + mark + ' of ' + mine.rem + '</b> and you&rsquo;re in 90%+ of the time. Projected finish: <b>' + mine.projW.toFixed(1) + ' wins</b>.' :
            'Even winning out isn&rsquo;t a lock. Projected finish: <b>' + mine.projW.toFixed(1) + ' wins</b>.') + '</p>';
      }

      /* Latest Gazette mention (current season only) */
      if (N && N.ofc && N.ofc.editions && N.ofc.editions.length) {
        var e = N.ofc.editions[N.ofc.editions.length - 1];
        if (e.s === S) {
          try {
            var ed = N.ofc.write(e.s, e.k), hit = null;
            ed.stories.forEach(function (sto, i) { if (!hit && sto.photo === m) hit = { s: sto, lead: i === 0 }; });
            if (!hit) ed.stories.forEach(function (sto, i) { if (!hit && sto.team === m) hit = { s: sto, lead: i === 0 }; });
            if (hit) right += '<a class="tsn-news" href="gazette.html?league=ofc&season=' + yr + '&week=' + e.k + '"><div class="tsn-news-k">The OFC Gazette &middot; Week ' + e.k + (hit.lead ? ' &middot; Front Page' : '') + '</div><div class="tsn-news-h">' + esc(hit.s.head) + '</div></a>';
          } catch (x) {}
        }
      }
      right += '<div class="tsn-links"><a href="race.html">Playoff Race</a></div>';

      slot.innerHTML =
        '<p class="team-section-heading">This Season</p>' +
        '<section class="tsn" aria-label="This season">' +
          '<div class="tsn-head"><div><div class="tsn-kicker">' + yr + ' OFC &middot; Through Week ' + K + '</div><div class="tsn-title">' + esc(me.name || ident(m).team) + '</div></div>' +
            '<span class="tsn-status" style="color:' + statusCol + '">' + statusTxt + '</span></div>' +
          '<div class="tsn-grid"><div class="tsn-col">' + tiles + chart + '</div><div class="tsn-col">' + right + '</div></div>' +
        '</section>';
      if (N && N.lowercase) N.lowercase(slot);

      /* Playoff-odds sparkline, a week at a time so the page never stalls */
      var spark = document.getElementById('tsnSpark'), J = [], k = 0;
      (function nextWeek() {
        if (!spark || k > K) return;
        J.push(k === K ? odds : ((E.ofc.odds(S, k) || {})[m] || 0)); k++;
        if (J.length >= 2) spark.innerHTML = '<polyline points="' + J.map(function (v, i) { return (i * 100 / K).toFixed(1) + ',' + (2 + (1 - v) * 18).toFixed(1); }).join(' ') + '"/>';
        setTimeout(nextWeek, 0);
      })();
    }
    function normCdf(z) {   // standard normal CDF (Abramowitz–Stegun)
      var t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2);
      var p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
      return z > 0 ? 1 - p : p;
    }

    /* ═════════════════════════════════════════════════════
       WRAPPED POPUP — plays wrapped.html (popup mode) over the team page.
       Close with its X, swipe down, Escape or the phone's back button.
    ═════════════════════════════════════════════════════ */
    var wrPop = null, wrPushed = false;
    function openWrapped(memberId, year) {
      if (wrPop) return;
      wrPop = document.createElement('div');
      wrPop.className = 'team-wr-pop';
      wrPop.setAttribute('role', 'dialog'); wrPop.setAttribute('aria-modal', 'true'); wrPop.setAttribute('aria-label', year + ' Wrapped');
      var f = document.createElement('iframe');
      f.title = year + ' Wrapped';
      f.setAttribute('allow', 'web-share; clipboard-write');
      f.src = 'wrapped.html?embed=1&league=ofc&season=' + encodeURIComponent(year) + '&m=' + encodeURIComponent(memberId);
      f.addEventListener('load', function () { try { f.focus(); } catch (x) {} });
      wrPop.appendChild(f);
      document.body.appendChild(wrPop);
      document.body.classList.add('team-wr-open');
      requestAnimationFrame(function () { if (wrPop) wrPop.classList.add('is-on'); });
      try { history.pushState({ teamWrapped: 1 }, ''); wrPushed = true; } catch (x) { wrPushed = false; }
    }
    function removeWrapped() {
      if (!wrPop) return;
      var el = wrPop; wrPop = null;
      el.classList.remove('is-on');
      document.body.classList.remove('team-wr-open');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 250);
    }
    function closeWrapped() {
      if (!wrPop) return;
      if (wrPushed) { wrPushed = false; history.back(); }   // popstate removes it
      else removeWrapped();
    }
    window.addEventListener('popstate', function () { wrPushed = false; removeWrapped(); });
    window.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'ofl-wrapped-close') closeWrapped();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && wrPop) closeWrapped(); });

    function renderNotFound(msg) {
      var content = document.getElementById('teamContent');
      content.innerHTML =
        '<div class="team-not-found">' +
          '<div class="team-not-found-title">404</div>' +
          '<p class="team-not-found-msg">' + esc(msg || 'Team not found') + '</p>' +
          '<a href="playas.html">&#x2190; Back to Roster</a>' +
        '</div>';
    }

    /* ── Boot ─────────────────────────────────────────────── */
    function init() {
      var config = window.SITE_CONFIG;
      var data   = window.OFL_DATA;
      if (!config || !data) { renderNotFound('Site data not loaded'); return; }

      var memberId = getParam('id');
      if (!memberId) { renderNotFound('No team ID specified'); return; }

      var member = (data.masterRoster || []).find(function (m) { return m.id === memberId; });
      if (!member) { renderNotFound('Member not found: ' + memberId); return; }

      var ofcLeague = getOFCLeague(data.leagueData);
      var ofcEntry  = getOFCEntry(member);
      if (!ofcEntry) { renderNotFound(member.name + ' has no OFC team data'); return; }

      // Apply team slideshow (overrides global slideshow started by menu.js)
      var teamSS = buildTeamSlideshow(ofcEntry, config);
      if (teamSS) {
        // Cancel global slideshow by clearing slide layers first
        ['slideA','slideB'].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) { el.style.animation = 'none'; el.classList.remove('kb-active','is-active'); }
        });
        setTimeout(function () { runTeamSlideshow(teamSS); }, 50);
        var overlayEl = document.getElementById('teamOverlay');
        if (overlayEl) {
          var teamOverlay = (ofcLeague && ofcLeague.slideshow && ofcLeague.slideshow.teamOverlay)
            ? ofcLeague.slideshow.teamOverlay : 'rgba(0,0,0,0.88)';
          overlayEl.style.background = teamOverlay;
        }
      }

      renderPage(member, ofcLeague, config);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  })();
  </script>

</body>
